<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Risk Orchestrator — the correlation matrix points at the wrong pods</title>
<style>
:root{
  --bg:#eef0f2; --card:#fff; --ink:#16181c; --mute:#6b7280; --line:#d9dde2;
  --crowd:#c0304a; --factor:#2f6f8f; --indep:#8b8f96; --pos:#1f7a4d; --neg:#c0304a;
  --hl:#f4c95d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:1080px;margin:0 auto;padding:34px 22px 90px}
.kicker{font:11.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
h1{font-size:31px;line-height:1.18;margin:0 0 12px;letter-spacing:-.02em;font-weight:700}
.lede{color:#3d434b;max-width:60ch;margin:0 0 6px}
h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:20px 22px;margin-top:20px}
.note{color:var(--mute);font-size:13.2px;margin:10px 0 0;max-width:74ch}
.note strong{color:var(--ink)}
hr{border:0;border-top:1px solid var(--line);margin:26px 0}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
th{font:11px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mute);text-align:right;
  padding:0 8px 7px;border-bottom:1px solid var(--line);font-weight:500}
th:first-child{text-align:left}
td{padding:7px 8px;border-bottom:1px solid #eef0f3;text-align:right;
  font-variant-numeric:tabular-nums}
td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.v{font-family:ui-monospace,Menlo,monospace;font-size:12.8px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  font-family:ui-monospace,Menlo,monospace;color:#fff}
.t-crowded{background:var(--crowd)} .t-factor{background:var(--factor)}
.t-independent{background:var(--indep)} .t-mixed{background:#b9bec5}
.btn{font:12.5px ui-monospace,Menlo,monospace;background:var(--card);
  border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}
.gl{stroke:#e6e9ed;stroke-width:1}
.axis{font:10.5px ui-monospace,Menlo,monospace;fill:var(--mute)}
.big{font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:6px}
.stat{border-left:3px solid var(--line);padding-left:13px}
.stat .lbl{font:11px ui-monospace,Menlo,monospace;color:var(--mute);
  text-transform:uppercase;letter-spacing:.08em}
.foot{color:var(--mute);font-size:12.4px;margin-top:26px;line-height:1.65}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;

const pctf=v=>(v==null?"—":(v*100).toFixed(1)+"%");
const cor=v=>(v==null?"—":(v>=0?"+":"")+v.toFixed(3));
const usd=v=>{ if(v==null) return "—";
  const m=v/1e6; return (m>=0?"+":"")+m.toFixed(2)+"m"; };

/* ---------- 1. the setup: pods that all look fine ---------- */
function PodTable({pods}){
  const [sort,setSort]=useState("id");
  const rows=useMemo(()=>{
    const c=[...pods];
    if(sort==="sharpe") c.sort((a,b)=>b.sharpe-a.sharpe);
    if(sort==="vol") c.sort((a,b)=>b.ann_vol-a.ann_vol);
    return c;
  },[pods,sort]);
  return (
    <div className="panel">
      <h2>Twenty pods, each defensible on its own</h2>
      <p className="note" style={{marginTop:2}}>
        Every book is dollar-neutral, scaled to the same target volatility, and
        rebalanced quarterly. An allocator reviewing these one at a time has
        nothing to object to — the Sharpe ratios are unremarkable and the
        volatilities are nearly identical. The labels are the ground truth of
        the simulation and would not exist at a real fund; they are shown
        because the whole question is whether the tools recover them.
      </p>
      <div className="bar">
        <span className="axis">sort</span>
        <button className="btn" aria-pressed={sort==="id"} onClick={()=>setSort("id")}>pod</button>
        <button className="btn" aria-pressed={sort==="sharpe"} onClick={()=>setSort("sharpe")}>sharpe</button>
        <button className="btn" aria-pressed={sort==="vol"} onClick={()=>setSort("vol")}>volatility</button>
      </div>
      <table>
        <thead><tr><th>Pod</th><th>Type</th><th>Ann return</th>
          <th>Ann vol</th><th>Sharpe</th></tr></thead>
        <tbody>{rows.map(p=>(
          <tr key={p.id}>
            <td className="v">{p.id}</td>
            <td><span className={"tag t-"+p.type}>{p.type}</span></td>
            <td className={"v "+(p.ann_ret>=0?"pos":"neg")}>{pctf(p.ann_ret)}</td>
            <td className="v">{pctf(p.ann_vol)}</td>
            <td className="v">{p.sharpe==null?"—":p.sharpe.toFixed(2)}</td>
          </tr>))}
        </tbody>
      </table>
    </div>
  );
}

/* ---------- 2. raw vs residual, the core claim ---------- */
function Separation({data}){
  const ks=data.separation.map(s=>s.k);
  const [k,setK]=useState(ks[1]!==undefined?ks[1]:ks[0]);
  const sep=data.separation.find(s=>s.k===k);
  const pairs=data.pairs[String(k)];
  const W=700,H=310,P={t:16,r:16,b:44,l:52};
  const lim=0.9;
  const x=v=>P.l+((v+lim)/(2*lim))*(W-P.l-P.r);
  const y=v=>P.t+(1-(v+lim)/(2*lim))*(H-P.t-P.b);
  const col=t=>t==="crowded"?"var(--crowd)":t==="factor"?"var(--factor)":
    t==="independent"?"var(--indep)":"#c8ccd2";
  return (
    <div className="panel">
      <h2>What the correlation matrix sees, and what is actually shared</h2>
      <p className="note" style={{marginTop:2}}>
        Horizontal is plain return correlation — the number a standard risk
        report ranks on. Vertical is correlation after common factor exposure
        has been regressed out, re-fitted every {data.meta.resid_window} days
        because a pod's loading changes each time it rebalances.
      </p>
      <div className="bar">
        <span className="axis">factors removed</span>
        {data.separation.map(s=>(
          <button key={s.k} className="btn" aria-pressed={s.k===k}
                  onClick={()=>setK(s.k)}>{s.factors.join(" + ")}</button>
        ))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",marginTop:10}}
           role="img" aria-label="raw against residual correlation by pair">
        {[-0.5,0,0.5].map(t=>(
          <g key={t}>
            <line className="gl" x1={x(t)} x2={x(t)} y1={P.t} y2={H-P.b}/>
            <line className="gl" x1={P.l} x2={W-P.r} y1={y(t)} y2={y(t)}/>
            <text className="axis" x={x(t)} y={H-P.b+15} textAnchor="middle">{t}</text>
            <text className="axis" x={P.l-7} y={y(t)+3} textAnchor="end">{t}</text>
          </g>
        ))}
        <line x1={P.l} x2={W-P.r} y1={y(0)} y2={y(0)} stroke="#c3c8cf" strokeWidth="1"/>
        <line x1={x(0)} x2={x(0)} y1={P.t} y2={H-P.b} stroke="#c3c8cf" strokeWidth="1"/>
        <line x1={x(-lim)} y1={y(-lim)} x2={x(lim)} y2={y(lim)}
              stroke="#c3c8cf" strokeDasharray="4 4" strokeWidth="1"/>
        {pairs.filter(p=>!p.flagged).map((p,i)=>(
          <circle key={"u"+i} cx={x(p.raw)} cy={y(p.resid)} r="3"
                  fill={col(p.true)} opacity={p.true==="mixed"?.28:.8}/>
        ))}
        {pairs.filter(p=>p.flagged).map((p,i)=>(
          <g key={"f"+i}>
            <circle cx={x(p.raw)} cy={y(p.resid)} r="7.5" fill="none"
                    stroke="var(--hl)" strokeWidth="2.4"/>
            <circle cx={x(p.raw)} cy={y(p.resid)} r="3.4" fill={col(p.true)}/>
          </g>
        ))}
        <text className="axis" x={(W)/2} y={H-8} textAnchor="middle">
          return correlation
        </text>
        <text className="axis" x={14} y={H/2} textAnchor="middle"
              transform={`rotate(-90 14 ${H/2})`}>residual correlation</text>
      </svg>
      <table>
        <thead><tr><th>Pairs</th><th>Count</th><th>Return corr</th>
          <th>Residual corr</th><th>Flagged</th></tr></thead>
        <tbody>{["crowded","factor","independent","mixed"].map(t=>{
          const b=sep.by_type[t]; if(!b) return null;
          return (<tr key={t}>
            <td><span className={"tag t-"+t}>{t}</span></td>
            <td className="v">{b.n}</td>
            <td className="v">{cor(b.raw)}</td>
            <td className="v">{cor(b.resid)}</td>
            <td className="v">{b.flagged}</td>
          </tr>);})}
        </tbody>
      </table>
      <p className="note">
        The factor row is the point. Those pods hold <strong>not one name in
        common</strong> and correlate at {cor(sep.by_type.factor?.raw)}; after the
        shared exposure comes out they sit at {cor(sep.by_type.factor?.resid)}.
        The crowded pods barely move — {cor(sep.by_type.crowded?.raw)} to{" "}
        {cor(sep.by_type.crowded?.resid)} — because what they share is not a
        factor. Rank pairs by the horizontal axis and every pod you call in is
        the wrong one.
      </p>
      <p className="note">
        A pair is flagged — ringed in amber — only when its residual correlation and its
        holdings overlap both survive Benjamini-Hochberg across all{" "}
        {data.meta.n_pairs} pairs. Either alone is weak: correlated residuals
        can be a factor the model missed, and shared names can be two managers
        liking one sector. Both together is the signature.
      </p>
      <p className="note">
        <strong>The factor pairs are scored twice on this page, in opposite
        directions, and both scores are right.</strong> This test does not flag
        them, and counts that as zero false positives. The thesis layer below
        groups those same pods together, and counts that as recovering a
        planted driver group. Read side by side without this sentence it looks
        like scoring both ways. It is not: the two tests answer different
        questions. Those pods are <em>not crowded</em> — they hold nothing in
        common and no forced exit puts them in the same bid, so a position test
        is right to reject them. They <em>are</em> making one bet, and will be
        wrong together on the day the driver turns, so a text test is right to
        find them. A fund needs both answers because the remedies differ:
        crowding is solved by cutting a position, a shared bet is not.
      </p>
    </div>
  );
}

/* ---------- 2b. VaR, and the same reversal inside it ---------- */
function VaR({data}){
  const v=data.var;
  if(!v||!v.by_type||!v.by_type.length) return null;
  const pct=x=>(x*100).toFixed(2)+"%";
  const cash=x=>(x*v.nav/1e6).toFixed(1)+"m";
  const label={crowded:"crowded",factor:"factor",independent:"independent"};
  return (
    <div className="panel">
      <h2>What the number every fund reports says about the same pods</h2>
      <p className="note">
        Value at Risk is the measure a risk committee reads daily: on the worst
        day in twenty, how much does the fund lose. It is here because a
        crowding tool should be tested against the instrument a desk already
        uses, not only against a bespoke one.
      </p>

      <div className="grid3" style={{marginTop:14}}>
        <div><div className="axis">VALUE AT RISK, {(v.alpha*100).toFixed(0)}%</div>
          <div className="big">{pct(v.var)}</div>
          <div className="axis">{cash(v.var)} on {(v.nav/1e6).toFixed(0)}m</div></div>
        <div><div className="axis">EXPECTED SHORTFALL</div>
          <div className="big">{pct(v.es)}</div>
          <div className="axis">mean loss beyond the threshold</div></div>
        <div><div className="axis">ES / VaR</div>
          <div className="big">{v.es_over_var.toFixed(2)}</div>
          <div className="axis">a normal distribution gives ~1.25</div></div>
      </div>

      <p className="note">
        A ratio of {v.es_over_var.toFixed(2)} against a normal distribution's
        1.25 means the losses beyond the threshold are worse than a parametric
        model would report — the argument for real returns rather than
        simulated ones, since a simulated covariance structure would have
        smoothed that tail away invisibly. Worst single day: {pct(v.worst_day)}.
      </p>

      <h2 style={{fontSize:"15px",marginTop:22}}>Which pods the VaR blames</h2>
      <table>
        <thead><tr><th>Pod type</th><th className="v">Pods</th>
          <th className="v">Capital</th><th className="v">VaR share</th>
          <th className="v">Per capital</th>
          <th className="v">Residual VaR</th><th className="v">Per capital</th>
        </tr></thead>
        <tbody>
          {v.by_type.map(d=>(
            <tr key={d.type}>
              <td><span className={"tag t-"+d.type}>{label[d.type]}</span></td>
              <td className="v">{d.n}</td>
              <td className="v">{(d.cap_share*100).toFixed(0)}%</td>
              <td className="v">{(d.var_share*100).toFixed(1)}%</td>
              <td className={"v "+(d.var_per_cap>1.2?"neg":"")}>
                {d.var_per_cap.toFixed(2)}×</td>
              <td className="v">{(d.res_share*100).toFixed(1)}%</td>
              <td className={"v "+(d.res_per_cap>1.2?"neg":"")}>
                {d.res_per_cap.toFixed(2)}×</td>
            </tr>))}
        </tbody>
      </table>

      <p className="note">
        <strong>Per capital</strong> is share of risk divided by share of money.
        A group at 1.00 carries exactly its size and is telling you nothing.
      </p>

      {v.rankings_disagree ? (
        <React.Fragment>
          <p className="note">
            <strong>Ranked by raw VaR: {v.rank_raw.join(" › ")}. After the{" "}
            {v.k_factors} factors come out: {v.rank_res.join(" › ")}.</strong>{" "}
            Raw VaR blames the factor pods, because VaR is a statement about the
            variance of the fund's total return and those pods correlate at
            +0.76. They are also the cheapest pods in the fund to lose — they
            hold no name in common, so a forced exit puts nobody into the same
            bid. Remove the factors and what they shared leaves with it, while
            what the crowded pods share stays. Same reversal as the pair
            correlations above, through an entirely different statistic.
          </p>
          <p className="note">
            A desk ranking on the standard number and a desk ranking on the
            corrected one would call in different managers, from the same fund,
            on the same day.
          </p>
        </React.Fragment>
      ) : (
        <p className="note">
          Both rankings agree here, before and after factors are removed. That is
          worth stating plainly rather than omitting: on this run VaR is not
          telling a different story from the residual measure, so it neither
          supports nor contradicts the reversal the pair correlations show.
        </p>
      )}

      <p className="note">
        <strong>What VaR cannot see.</strong> It answers from the covariance of
        returns and is silent about who holds what. Six managers holding six
        disjoint baskets look diversified to it, and go on looking diversified
        right up to the morning they all sell for the same reason. The loss then
        is not a price move — it is the cost of the exit, and that depends on
        the overlap of the books, not the covariance of the returns.
      </p>
    </div>
  );
}

/* ---------- 3. concentration against chance ---------- */
function Ladder({data}){
  const all=data.ladder;
  // Plot only as far as there is something to see. Everything past the last
  // threshold holding 0.1% of the book draws as a flat line on zero, which
  // makes the chart claim the story ends earlier than the table says it does.
  const lastLive=Math.max(...all.filter(d=>d.real>=0.001).map(d=>d.t));
  const L=all.filter(d=>d.t<=lastLive);
  const W=700,H=270,P={t:16,r:16,b:42,l:52};
  const max=Math.max(...L.map(d=>Math.max(d.real,d.chance)))*1.08;
  const span=Math.max(1,lastLive-2);
  const x=t=>P.l+((t-2)/span)*(W-P.l-P.r);
  const y=v=>P.t+(1-v/max)*(H-P.t-P.b);
  const path=key=>L.map((d,i)=>(i?"L":"M")+x(d.t).toFixed(1)+" "+y(d[key]).toFixed(1)).join(" ");
  const first=L.find(d=>d.p<data.meta.alpha&&d.real>=0.001);
  return (
    <div className="panel">
      <h2>How much of the book is genuinely crowded, and how much is arithmetic</h2>
      <p className="note" style={{marginTop:2}}>
        Share of the fund's gross book sitting in names held long by t or more
        separate pods, against what independent selection from the same
        universe produces.
      </p>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",marginTop:10}}
           role="img" aria-label="crowding against chance by threshold">
        {[0,.25,.5,.75].filter(v=>v<max).map(v=>(
          <g key={v}>
            <line className="gl" x1={P.l} x2={W-P.r} y1={y(v)} y2={y(v)}/>
            <text className="axis" x={P.l-7} y={y(v)+3} textAnchor="end">{Math.round(v*100)}%</text>
          </g>
        ))}
        <path d={path("chance")} fill="none" stroke="#9aa1a9" strokeWidth="1.8" strokeDasharray="5 4"/>
        <path d={path("real")} fill="none" stroke="var(--crowd)" strokeWidth="2.4"/>
        {L.map(d=>(
          <g key={d.t}>
            <circle cx={x(d.t)} cy={y(d.real)} r="3.4" fill="var(--crowd)"/>
            <circle cx={x(d.t)} cy={y(d.chance)} r="2.6" fill="#9aa1a9"/>
            <text className="axis" x={x(d.t)} y={H-P.b+15} textAnchor="middle">{d.t}</text>
          </g>
        ))}
        <text className="axis" x={W/2} y={H-8} textAnchor="middle">
          held long by t or more pods{lastLive<10?"  (higher thresholds hold under 0.1% of the book)":""}
        </text>
      </svg>
      <table>
        <thead><tr><th>t</th><th>Real</th><th>Chance</th><th>Excess</th><th>p</th></tr></thead>
        <tbody>{L.map(d=>{
          // A p-value here is censored, not measured, whenever no permutation
          // reached the real value - and that is exactly what happens once the
          // chance line hits zero. The p then equals 1/(draws+1) no matter how
          // large the excess is, so 0.005 on a +1.2pp gap and 0.005 on a
          // +0.3pp gap are the same number for the same uninformative reason.
          // The first version of this check tested whether BOTH sides were
          // near zero, which missed these rows entirely: real was 1.3% while
          // chance was 0.0%. The floor lives on the null side alone.
          const floored=d.p<=1.5/(data.meta.n_perm+1);
          const dead=d.real<0.001&&d.chance<0.001;
          return (
          <tr key={d.t} style={dead?{opacity:.45}:null}>
            <td className="v">{d.t}</td>
            <td className="v">{pctf(d.real)}</td>
            <td className="v">{pctf(d.chance)}</td>
            <td className={"v "+(!dead&&d.real-d.chance>0?"pos":"")}>
              {dead?"—":(d.real-d.chance>=0?"+":"")+((d.real-d.chance)*100).toFixed(1)+"pp"}</td>
            <td className="v" title={floored?"censored at the null's resolution":""}>
              {dead?"—":(floored?"<"+(1.5/(data.meta.n_perm+1)).toFixed(3):d.p.toFixed(3))}</td>
          </tr>);})}
        </tbody>
      </table>
      <p className="note">
        Rows are greyed where both real and chance fall below 0.1% of the book:
        nothing left to compare at that size. Where p reads as a
        <strong> less-than</strong>, no permutation out of {data.meta.n_perm}
        {" "}ever reached the real value, so the figure is the resolution of the
        null rather than a measurement — the true p could be far smaller and the
        printed number would be identical. Several rows carrying that same bound is one
        fact about the number of draws, not several separate findings.
      </p>
      <p className="note">
        The dashed line is why this chart exists. {pctf(L[0].real)} of the book
        sits in names two or more pods hold — an alarming sentence, and{" "}
        {pctf(all[0].chance)} of it is what {data.meta.n_pods} managers drawing
        from one universe produce by counting alone.
        {first && <> Real and chance separate at t = {first.t}. </>}
        A report quoting the headline share without its chance floor is
        reporting arithmetic as risk.
      </p>
    </div>
  );
}


/* ---------- who holds what ---------- */
function Grid({data}){
  const g=data.holdings_grid;
  if(!g) return null;
  const [only,setOnly]=useState(false);
  const rows=g.pods.map((p,i)=>({pod:p,type:g.types[i],cells:g.cells[i]}))
    .filter(r=>!only||r.cells.some(c=>c>0));
  const cw=Math.min(34,760/g.names.length);
  const W=150+g.names.length*cw, H=34+rows.length*17;
  return (
    <div className="panel">
      <h2>Who is actually in the crowded names</h2>
      <p className="note" style={{marginTop:2}}>
        The {g.names.length} names with the most one-way pressure in {g.era},
        against every pod. Filled square is long, hollow is short, blank is not
        held. This is the raw fact the statistics summarise — no test, no null,
        just the books side by side.
      </p>
      <div className="bar">
        <button className="btn" aria-pressed={only} onClick={()=>setOnly(!only)}>
          {only?"✓ ":""}only pods holding these
        </button>
      </div>
      <div style={{overflowX:"auto",marginTop:10}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:Math.min(W,700)+"px",height:"auto"}}
           role="img" aria-label="pods against crowded names">
        {g.names.map((n,j)=>(
          <text key={n} className="axis" x={150+j*cw+cw/2} y={26}
                textAnchor="start" transform={`rotate(-60 ${150+j*cw+cw/2} 26)`}>
            {n}
          </text>
        ))}
        {rows.map((r,i)=>(
          <g key={r.pod} transform={`translate(0 ${34+i*17})`}>
            <text className="axis" x="0" y="11">{r.pod}</text>
            <rect x="62" y="2" width="52" height="11" rx="5"
                  fill={r.type==="crowded"?"var(--crowd)":
                        r.type==="factor"?"var(--factor)":"var(--indep)"}/>
            <text x="88" y="11" textAnchor="middle"
                  style={{fill:"#fff",font:"9px ui-monospace,Menlo,monospace"}}>
              {r.type.slice(0,6)}
            </text>
            {r.cells.map((c,j)=>(
              c===0?null:
              <rect key={j} x={150+j*cw+2} y="2" width={cw-4} height="11" rx="2"
                    fill={c>0?(r.type==="crowded"?"var(--crowd)":"#7d848c"):"none"}
                    stroke={c>0?"none":"#9aa1a9"} strokeWidth="1"
                    opacity={c>0?.9:.8}/>
            ))}
          </g>
        ))}
      </svg>
      </div>
      <p className="note">
        The dark band is the five crowded pods sharing a basket — the same
        columns filled again and again. A correlation matrix compresses that
        picture into one number per pair and, as the chart above shows, that
        number puts these pods near the bottom of the ranking. The overlap was
        never hidden; it was only invisible in the statistic people look at.
      </p>
    </div>
  );
}

- Different vocabulary, same cause -> SAME group.
- Same sector, different cause -> DIFFERENT groups.

/* ---------- returns-based analysis, when the names resolve ----------
   The upload panel can aggregate positions and read text without any market
   data. Three things it cannot do without returns: a Sharpe, a residual
   correlation, and an unwind priced in dollars. So the demo pack ships the
   daily returns for the names it uses, and these run whenever enough of an
   uploaded book resolves against that bundle.

   The coverage floor is deliberate. A residual correlation computed on 40% of
   a book is a different number from the real one, and it looks identical when
   printed. Below the floor the analyses are refused rather than shown with a
   caveat nobody reads; above it, the coverage is printed next to every result. */
const COVERAGE_FLOOR=0.80;

function podSeries(rows, bundle){
  // manager return series from weights and the shipped daily returns
  const out={}, cov={};
  const pods=[...new Set(rows.map(r=>r.pod))];
  const n=bundle.dates.length;
  pods.forEach(p=>{
    const mine=rows.filter(r=>r.pod===p);
    const tot=mine.reduce((a,r)=>a+r.exp,0)||1;
    let found=0, series=new Array(n).fill(0);
    mine.forEach(r=>{
      const s=bundle.names[r.ticker];
      if(!s) return;
      found+=r.exp;
      const sgn=r.side==="short"?-1:1;
      const w=sgn*r.exp/tot;
      for(let i=0;i<n;i++) series[i]+=w*s[i];
    });
    cov[p]=found/tot;
    out[p]=series;
  });
  return {series:out, cov, pods};
}

function corr(a,b){
  const n=Math.min(a.length,b.length);
  let ma=0,mb=0; for(let i=0;i<n;i++){ma+=a[i];mb+=b[i];}
  ma/=n; mb/=n;
  let sa=0,sb=0,sab=0;
  for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb; sa+=x*x; sb+=y*y; sab+=x*y;}
  return (sa>0&&sb>0)? sab/Math.sqrt(sa*sb) : 0;
}

function blockShift(x, block, rnd){
  // Circular block bootstrap, same as block_shift() in pods2_crowding.py:
  // keeps each series' own dynamics, destroys alignment BETWEEN series.
  const n=x.length, nb=Math.ceil(n/block), out=new Array(n);
  let w=0;
  for(let b=0;b<nb&&w<n;b++){
    const st=Math.floor(rnd()*n);
    for(let i=0;i<block&&w<n;i++) out[w++]=x[(st+i)%n];
  }
  return out;
}

function pairPvalues(resid, names, nBoot, block, seed){
  // Pooled null, ported from pair_pvalues() in pods2_crowding.py.
  //
  // WHY POOLED AND NOT PER-PAIR. A per-pair p from B draws cannot go below
  // 1/(B+1). With 15 pairs BH's tightest threshold is 0.05/15 = 0.0033, and
  // 300 draws floor at 0.0033 - exactly on the boundary, so nothing could
  // reliably survive. Pooling every pair's null draws into one reference
  // distribution gives B x npairs values and a floor far below the threshold.
  // Under the null the pairs are exchangeable, so pooling is legitimate.
  let st=seed>>>0;
  const rnd=()=>{ st^=st<<13; st>>>=0; st^=st>>17; st^=st<<5; st>>>=0;
                  return st/4294967296; };
  const m=names.length;
  const z=names.map(p=>{
    const x=resid[p], n=x.length;
    const mu=x.reduce((a,b)=>a+b,0)/n;
    const sd=Math.sqrt(x.reduce((a,b)=>a+(b-mu)*(b-mu),0)/n)||1;
    return x.map(v=>(v-mu)/sd);
  });
  const pool=[];
  for(let b=0;b<nBoot;b++){
    const Y=z.map(x=>blockShift(x,block,rnd));
    for(let i=0;i<m;i++)
      for(let j=i+1;j<m;j++) pool.push(Math.abs(corr(Y[i],Y[j])));
  }
  pool.sort((a,b)=>a-b);
  const pOf=obs=>{
    let lo=0,hi=pool.length;
    while(lo<hi){ const mid=(lo+hi)>>1; if(pool[mid]<obs) lo=mid+1; else hi=mid; }
    return (pool.length-lo+1)/(pool.length+1);
  };
  return {pOf, nRef:pool.length, floor:1/(pool.length+1)};
}

function benjaminiHochberg(ps, alpha){
  // Same procedure as benjamini_hochberg() in pods2_crowding.py.
  const n=ps.length;
  if(!n) return [];
  const ord=ps.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);
  let cut=-1;
  for(let r=0;r<n;r++) if(ord[r][0]<=alpha*(r+1)/n) cut=r;
  const keep=new Array(n).fill(false);
  for(let r=0;r<=cut;r++) keep[ord[r][1]]=true;
  return keep;
}

function residualise(series, factors, k, win){
  // Block-wise OLS, same as scripts/pods2_crowding.py. Fitting one regression
  // over the whole sample cannot track a loading that changes when the book
  // changes; on the CRSP pods a full-sample fit left factor pairs at 0.41 and
  // block fitting took them to 0.05.
  const n=series.length, F=factors.map(f=>f.slice(0,n));
  const out=new Array(n).fill(0);
  for(let s0=0;s0<n;s0+=win){
    const s1=Math.min(s0+win,n);
    const m=s1-s0;
    if(m<k+5){ for(let i=s0;i<s1;i++) out[i]=series[i]; continue; }
    // normal equations for [1, F1..Fk]
    const X=[]; for(let i=s0;i<s1;i++){
      const row=[1]; for(let j=0;j<k;j++) row.push(F[j][i]); X.push(row); }
    const p=k+1;
    const A=Array.from({length:p},()=>new Array(p).fill(0));
    const b=new Array(p).fill(0);
    for(let i=0;i<m;i++){
      for(let u=0;u<p;u++){
        b[u]+=X[i][u]*series[s0+i];
        for(let v=0;v<p;v++) A[u][v]+=X[i][u]*X[i][v];
      }
    }
    // gaussian elimination with a ridge nudge for stability
    for(let u=0;u<p;u++) A[u][u]+=1e-10;
    for(let u=0;u<p;u++){
      let piv=u;
      for(let v=u+1;v<p;v++) if(Math.abs(A[v][u])>Math.abs(A[piv][u])) piv=v;
      [A[u],A[piv]]=[A[piv],A[u]]; [b[u],b[piv]]=[b[piv],b[u]];
      if(Math.abs(A[u][u])<1e-14) continue;
      for(let v=u+1;v<p;v++){
        const f=A[v][u]/A[u][u];
        for(let w2=u;w2<p;w2++) A[v][w2]-=f*A[u][w2];
        b[v]-=f*b[u];
      }
    }
    const beta=new Array(p).fill(0);
    for(let u=p-1;u>=0;u--){
      let acc=b[u];
      for(let v=u+1;v<p;v++) acc-=A[u][v]*beta[v];
      beta[u]=Math.abs(A[u][u])<1e-14?0:acc/A[u][u];
    }
    for(let i=0;i<m;i++){
      let fit=beta[0];
      for(let j=0;j<k;j++) fit+=beta[j+1]*F[j][s0+i];
      out[s0+i]=series[s0+i]-fit;
    }
  }
  return out;
}

/* ---------- run it on your own book ---------- */
function Upload(){
  const [err,setErr]=useState(null);
  const [minPods,setMinPods]=useState(2);
  const [nPerm,setNPerm]=useState(2000);
  const [busy,setBusy]=useState(false);
  const [res,setRes]=useState(null);

  const parse=(text,fileName)=>{
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2) throw new Error(`${fileName}: no rows`);
    const head=lines[0].split(",").map(h=>h.trim().toLowerCase());
    if(!head.includes("ticker"))
      throw new Error(`${fileName}: no "ticker" column. Found: ${head.join(", ")}`);
    const iPod=head.indexOf("pod"), iTic=head.indexOf("ticker");
    // One file per manager is the natural way to hand this over, so a file
    // with no pod column IS one pod and takes its name from the file.
    const fallbackPod=fileName.replace(/\.[^.]+$/,"");
    const iW=head.indexOf("weight"), iS=head.indexOf("side"),
          iN=head.indexOf("nominal"), iNav=head.indexOf("nav");
    const out=[];
    for(let i=1;i<lines.length;i++){
      const c=lines[i].split(",").map(x=>x.trim());
      if(c.length<2) continue;
      let w=iW>=0?parseFloat(c[iW]):NaN;
      let nom=iN>=0?parseFloat(c[iN]):NaN;
      const nav=iNav>=0?parseFloat(c[iNav]):NaN;
      // A weight is a fraction of the pod's OWN nav, so summing weights across
      // pods silently treats a 500m book and a 50m book as the same size. Where
      // nav or nominal is supplied, exposure is carried in currency instead and
      // the aggregation is correct; where it is not, the equal-size assumption
      // is made explicit in the output rather than buried here.
      if(!isFinite(nom)&&isFinite(w)&&isFinite(nav)) nom=w*nav;
      if(!isFinite(w)&&isFinite(nom)&&isFinite(nav)&&nav!==0) w=nom/nav;
      let side=iS>=0?(c[iS]||"").toLowerCase():"";
      if(!side) side=((isFinite(w)&&w<0)||(isFinite(nom)&&nom<0))?"short":"long";
      out.push({pod:(iPod>=0&&c[iPod])?c[iPod]:fallbackPod, ticker:c[iTic],
                weight:isFinite(w)?Math.abs(w):null,
                nominal:isFinite(nom)?Math.abs(nom):null,
                side:side.startsWith("s")?"short":"long"});
    }
    if(!out.length) throw new Error("no usable rows");
    // equal-weight within each leg where weights were not supplied
    const legs={};
    out.forEach(r=>{ if(r.weight===null){
      const k=r.pod+"|"+r.side; legs[k]=(legs[k]||0)+1; }});
    out.forEach(r=>{ if(r.weight===null){
      r.weight=0.5/legs[r.pod+"|"+r.side]; r.assumed=true; }});
    return out;
  };

  // One row per manager, each holding that manager's book and, optionally,
  // what they wrote. Keeping both in the same row is the answer to "which
  // thesis belongs to which pod" - it is not inferred from a file name, it is
  // stated, and the row shows it.
  const [slots,setSlots]=useState([
    {id:1,name:"",pos:null,posRows:[],thesis:null,thesisFile:""},
    {id:2,name:"",pos:null,posRows:[],thesisFile:"",thesis:null},
  ]);
  const [nextId,setNextId]=useState(3);
  const addSlot=()=>{ setSlots(sl=>[...sl,{id:nextId,name:"",pos:null,
    posRows:[],thesis:null,thesisFile:""}]); setNextId(n=>n+1); };
  const dropSlot=id=>setSlots(sl=>sl.filter(x=>x.id!==id));
  const setSlot=(id,patch)=>setSlots(sl=>sl.map(x=>x.id===id?{...x,...patch}:x));

  const loadPositions=(id,file)=>{
    if(!file) return;
    setErr(null); setRes(null);
    file.text().then(t=>{
      try{
        const auto=file.name.replace(/\.[^.]+$/,"");
        const cur=slots.find(x=>x.id===id);
        const nm=(cur&&cur.name)?cur.name:auto;
        const p=parse(t,file.name).map(r=>({...r,pod:nm}));
        setSlot(id,{pos:file.name,posRows:p,name:nm});
      }catch(ex){ setErr(ex.message); }
    });
  };
  const loadThesis=(id,file)=>{
    if(!file) return;
    setErr(null);
    file.text().then(t=>{
      const auto=file.name.replace(/\.[^.]+$/,"");
      const cur=slots.find(x=>x.id===id);
      setSlot(id,{thesis:t,thesisFile:file.name,
                  name:(cur&&cur.name)?cur.name:auto});
    });
  };

  // renaming a manager relabels their positions too
  const rename=(id,nm)=>setSlots(sl=>sl.map(x=>x.id===id
    ? {...x,name:nm,posRows:x.posRows.map(r=>({...r,pod:nm}))} : x));

  const rows=useMemo(()=>{
    const all=[];
    slots.forEach(s2=>{ if(s2.name) all.push(...s2.posRows); });
    return all.length?all:null;
  },[slots]);
  const theses=useMemo(()=>{
    const t={};
    slots.forEach(s2=>{ if(s2.name&&s2.thesis) t[s2.name]=s2.thesis; });
    return t;
  },[slots]);

  const run=()=>{
    if(!rows) return;
    setBusy(true);
    setTimeout(()=>{
      try{
        const pods=[...new Set(rows.map(r=>r.pod))];
        const uni=[...new Set(rows.map(r=>r.ticker))];
        // Use currency if EVERY row has it. Mixing dollars and own-nav weights
        // in one sum would be worse than either alone.
        const inCash=rows.every(r=>r.nominal!=null);
        rows.forEach(r=>{ r.exp = inCash ? r.nominal : r.weight; });
        const longsBy={}, wByPod={};
        pods.forEach(p=>{longsBy[p]=new Set(); wByPod[p]={};});
        const net={}, gross={}, press={}, nLong={};
        rows.forEach(r=>{
          const sgn=r.side==="short"?-1:1;
          net[r.ticker]=(net[r.ticker]||0)+sgn*r.exp;
          gross[r.ticker]=(gross[r.ticker]||0)+r.exp;
          if(sgn>0){
            press[r.ticker]=(press[r.ticker]||0)+r.exp;
            nLong[r.ticker]=(nLong[r.ticker]||0)+1;
            longsBy[r.pod].add(r.ticker);
          }
        });
        const G=Object.values(gross).reduce((a,b)=>a+b,0)||1;

        // ladder, real
        const ladder=[];
        for(let t=2;t<=Math.min(8,pods.length);t++){
          const share=Object.keys(gross)
            .filter(k=>(nLong[k]||0)>=t)
            .reduce((a,k)=>a+gross[k],0)/G;
          ladder.push({t, real:share, chance:0, p:1});
        }
        // chance floor: redraw each pod's long book at random from the
        // universe actually held, keeping book sizes fixed.
        //
        // SEEDED, AND THAT IS NOT A DETAIL. This null used Math.random(), so
        // every page load drew a different sample and the same book produced a
        // different p-value each time. On the demo pack two consecutive runs
        // gave 0.030 and 0.060 - one clearing the conventional threshold and
        // one not, from identical input. A dashboard that changes its verdict
        // on reload is not reporting a measurement, and a reader has no way to
        // tell an unstable estimate from a real one.
        //
        // A fixed seed makes the number reproducible. It does not make it more
        // accurate - the p is still an estimate with sampling error, and a
        // different seed would give a different answer - so the draw count is
        // raised as well, which is the part that actually shrinks the error.
        let lseed=20260823>>>0;
        const lrnd=()=>{ lseed^=lseed<<13; lseed>>>=0; lseed^=lseed>>17;
                         lseed^=lseed<<5; lseed>>>=0; return lseed/4294967296; };
        const sizes=pods.map(p=>longsBy[p].size);
        const nullShare={};
        ladder.forEach(l=>nullShare[l.t]=[]);
        for(let b=0;b<nPerm;b++){
          const cnt={};
          sizes.forEach(sz=>{
            const pick=new Set();
            while(pick.size<sz && pick.size<uni.length)
              pick.add(uni[Math.floor(lrnd()*uni.length)]);
            pick.forEach(k=>cnt[k]=(cnt[k]||0)+1);
          });
          ladder.forEach(l=>{
            const s=Object.keys(cnt).filter(k=>cnt[k]>=l.t)
              .reduce((a,k)=>a+(gross[k]||0),0)/G;
            nullShare[l.t].push(s);
          });
        }
        ladder.forEach(l=>{
          const arr=nullShare[l.t];
          l.chance=arr.reduce((a,b)=>a+b,0)/arr.length;
          l.p=(arr.filter(x=>x>=l.real).length+1)/(arr.length+1);
        });

        // pairwise long-book overlap
        const pairs=[];
        for(let i=0;i<pods.length;i++)
          for(let j=i+1;j<pods.length;j++){
            const A=longsBy[pods[i]], B=longsBy[pods[j]];
            let inter=0; A.forEach(x=>{if(B.has(x)) inter++;});
            const uni2=A.size+B.size-inter;
            pairs.push({a:pods[i], b:pods[j],
                        jac:uni2?inter/uni2:0, shared:inter});
          }
        pairs.sort((x,y)=>y.jac-x.jac);

        // RANKING BY DOLLAR EXPOSURE DROPPED WHOLE MANAGERS. The grid took the
        // top 15 names by pressure, and pressure is a currency figure, so the
        // smallest book contributes the smallest per-name exposure and its
        // names fall off the bottom. On the demo pack the two smallest
        // managers ($180m and $150m against $400m) had NO name in the top 15
        // and rendered as entirely blank rows - which reads as "holds nothing"
        // rather than "holds nothing large enough to make this list".
        //
        // Every manager is now guaranteed their largest position in the grid,
        // appended to the ranked list if it did not already make the cut.
        const allNames=Object.keys(gross).map(k=>({
          ticker:k, net:net[k], gross:gross[k],
          press:press[k]||0, n:nLong[k]||0}))
          .sort((x,y)=>y.press-x.press);
        const shown=new Set(allNames.slice(0,15).map(n=>n.ticker));
        pods.forEach(p=>{
          const mine=[...(longsBy[p]||[])];
          if(!mine.length || mine.some(t=>shown.has(t))) return;
          const biggest=mine.map(t=>allNames.find(n=>n.ticker===t))
                            .filter(Boolean)
                            .sort((x,y)=>y.press-x.press)[0];
          if(biggest) shown.add(biggest.ticker);
        });
        const names=allNames.filter(n=>shown.has(n.ticker));

        // per-manager summary
        const mgr=pods.map(p=>{
          const mine=rows.filter(r=>r.pod===p);
          const L=mine.filter(r=>r.side==="long").reduce((a,r)=>a+r.exp,0);
          const S=mine.filter(r=>r.side==="short").reduce((a,r)=>a+r.exp,0);
          return {pod:p, nLong:mine.filter(r=>r.side==="long").length,
                  nShort:mine.filter(r=>r.side==="short").length,
                  gross:L+S, net:L-S,
                  nav:(mine.find(r=>r.nominal!=null&&r.weight)||{}) &&
                      (inCash? (mine[0].nominal/ (mine[0].weight||1)) : null)};
        });

        // grid: manager against the most-pressured names.
        //
        // NO SECOND CUT HERE. `names` has already been built to guarantee every
        // manager at least one column, and re-slicing it to a fixed 16 undid
        // that for whoever was appended last - on the demo pack it restored one
        // blank manager row after the first fix had removed two. A cap that
        // silently discards the thing a previous step deliberately added is
        // worse than no cap.
        const gridNames=names.map(n=>n.ticker);
        const grid=pods.map(p=>({pod:p, cells:gridNames.map(t=>{
          const r=rows.find(x=>x.pod===p&&x.ticker===t);
          return r?(r.side==="long"?1:-1):0;
        })}));

        // if one manager is forced out, who else is in those names
        const exit=pods.map(p=>{
          const theirs=rows.filter(r=>r.pod===p&&r.side==="long");
          const set=new Set(theirs.map(r=>r.ticker));
          const hit=pods.filter(q=>q!==p).map(q=>{
            const ex=rows.filter(r=>r.pod===q&&r.side==="long"&&set.has(r.ticker));
            return {pod:q, exposed:ex.reduce((a,r)=>a+r.exp,0),
                    names:ex.length};
          }).filter(h=>h.exposed>0).sort((a,b)=>b.exposed-a.exposed);
          return {pod:p, sold:theirs.reduce((a,r)=>a+r.exp,0),
                  others:hit.reduce((a,h)=>a+h.exposed,0),
                  nHit:hit.length, top:hit.slice(0,3)};
        }).sort((a,b)=>b.others-a.others);

        // ---- returns-based analyses, only where the names resolve
        let ret=null;
        if(bundle&&bundle.names){
          const {series,cov}=podSeries(rows,bundle);
          const covered=pods.filter(p=>cov[p]>=COVERAGE_FLOOR);
          const meanCov=pods.reduce((a,p)=>a+cov[p],0)/pods.length;
          if(covered.length>=2){
            const k=Math.min(5,bundle.factor_names.length);
            const F=bundle.factor_names.slice(0,k).map(f=>bundle.factors[f]);
            const resid={};
            covered.forEach(p=>resid[p]=residualise(series[p],F,k,63));
            const cp=[];
            for(let i=0;i<covered.length;i++)
              for(let j=i+1;j<covered.length;j++){
                const p=covered[i],q=covered[j];
                const A=new Set(rows.filter(r=>r.pod===p&&r.side==="long").map(r=>r.ticker));
                const Bs=new Set(rows.filter(r=>r.pod===q&&r.side==="long").map(r=>r.ticker));
                let inter=0; A.forEach(x=>{if(Bs.has(x)) inter++;});
                cp.push({a:p,b:q,
                  raw:corr(series[p],series[q]),
                  resid:corr(resid[p],resid[q]),
                  jac:(A.size+Bs.size-inter)?inter/(A.size+Bs.size-inter):0});
              }

            // A residual correlation is flagged only if it survives a null and
            // then Benjamini-Hochberg across every pair. The earlier version
            // used |resid| > 0.1 with no null at all, which is the p-value
            // floor error in a different costume: a fixed cut cannot know how
            // large a residual correlation this many days of data throws off
            // by chance, and on the demo pack it produced two false positives
            // at +0.121 and +0.113 beside a true one at +0.191.
            const NB=300, BLK=21, ALPHA=0.05;
            const nullRes=pairPvalues(resid, covered, NB, BLK, 20260823);
            cp.forEach(c=>{ c.p=nullRes.pOf(Math.abs(c.resid)); });
            const keep=benjaminiHochberg(cp.map(c=>c.p), ALPHA);
            cp.forEach((c,i)=>{ c.sig=keep[i]; });

            // SIGNIFICANCE IS NECESSARY AND NOT SUFFICIENT, and the demo pack
            // is what taught us. Over 1,500 days the null calls any residual
            // correlation above about 0.06 significant, because it tests
            // INDEPENDENCE. Six books that still share unmodelled factor
            // exposure are genuinely not independent, so 9 of 15 pairs cleared
            // BH while only 2 were planted. A fixed cut at 0.1 is not the
            // answer either - it is a number with no defence.
            //
            // The second gate is the fund's OWN median absolute residual. Every
            // pair carries that much; it is what five factors failed to remove,
            // measured on this fund rather than assumed. Crowding is the excess
            // over it. On the demo pack the baseline is 0.087 and the gate at
            // twice that flags exactly the planted crowded pair and the planted
            // latent one, and nothing else.
            // THE AND-GATE, AND WHAT SITS OUTSIDE IT.
            //
            // "Crowded" requires BOTH a significant residual correlation and
            // shared names, exactly as pods2_crowding.py does, and for the
            // same reason: a correlated residual on its own can be a factor
            // the model missed, so overlap is what keeps false positives at
            // zero. Loosening that to residual-only reintroduces precisely
            // the errors the AND-gate exists to prevent.
            //
            // A significant residual with NO shared names is not a weaker
            // form of crowding and does not get a lower bar. It is a
            // different finding with a different remedy - two managers whose
            // books will move together while every position report shows
            // nothing - so it gets its own name rather than a discount.
            // pods2 cannot reach this cell at all, because zero overlap can
            // never clear its second gate. That is the cell the text layer
            // exists for.
            //
            // The fund's median absolute residual is reported alongside, not
            // as a gate. It measures what the factor model failed to remove;
            // a flagged pair barely above it is worth reading twice.
            const absR=cp.map(c=>Math.abs(c.resid)).sort((x,y)=>x-y);
            const baseline=absR.length%2 ? absR[(absR.length-1)/2]
                          : (absR[absR.length/2-1]+absR[absR.length/2])/2;
            const OVL=0.05;
            // SIGN MATTERS AND THE FIRST VERSION IGNORED IT. The null is
            // two-sided, which is right - a residual correlation far from zero
            // in either direction is a real relationship. But the LABEL is not
            // symmetric. A significantly NEGATIVE residual correlation means
            // the two books offset each other once factors are stripped: they
            // are each other's hedge, not each other's crowd, and calling that
            // "shared risk" tells a risk desk to act on the exact opposite of
            // what is happening. The demo pack surfaced it - lmoreau against
            // schen at -0.127 was reported as shared risk.
            cp.forEach(c=>{ c.crowded=c.sig&&c.resid>0&&c.jac>=OVL;
                            c.sharedRisk=c.sig&&c.resid>0&&c.jac<OVL;
                            c.offset=c.sig&&c.resid<0;
                            c.flag=c.sig; });
            const nullMeta={nBoot:NB, block:BLK, alpha:ALPHA,
                            nRef:nullRes.nRef, floor:nullRes.floor,
                            nSig:keep.filter(Boolean).length, baseline,
                            ovl:OVL,
                            nCrowd:cp.filter(c=>c.crowded).length,
                            nRisk:cp.filter(c=>c.sharedRisk).length,
                            nOff:cp.filter(c=>c.offset).length};
            const stats=covered.map(p=>{
              const x=series[p], n2=x.length;
              const mu=x.reduce((a,b)=>a+b,0)/n2;
              const sd2=Math.sqrt(x.reduce((a,b)=>a+(b-mu)*(b-mu),0)/n2);
              return {pod:p, ann:mu*252, vol:sd2*Math.sqrt(252),
                      sharpe:sd2>0?(mu*252)/(sd2*Math.sqrt(252)):0,
                      cov:cov[p]};
            });
            // unwind priced with the shipped volatilities
            const un=covered.map(p=>{
              const mine=rows.filter(r=>r.pod===p&&r.side==="long");
              let hit=0;
              mine.forEach(r=>{
                const v=bundle.vol[r.ticker], c=bundle.cap[r.ticker];
                if(!v||!c) return;
                const move=-1.0*v/Math.sqrt(252)*Math.sqrt(r.exp/(0.005*c));
                covered.forEach(q=>{ if(q===p) return;
                  const o=rows.find(x=>x.pod===q&&x.ticker===r.ticker&&x.side==="long");
                  if(o) hit+=o.exp*move;
                });
              });
              return {pod:p, damage:hit};
            }).sort((x,y)=>x.damage-y.damage);
            // VaR, so this panel runs the same analysis as the precomputed
            // section rather than a subset of it. Equal capital weights,
            // because a position file carries no allocation - stated below
            // rather than hidden, since a real fund's weights would change the
            // decomposition.
            const vN=covered.length;
            const wq=1/vN;
            const fundR=series[covered[0]].map((_,i)=>
              covered.reduce((acc,p)=>acc+series[p][i]*wq,0));
            const residR=series[covered[0]].map((_,i)=>
              covered.reduce((acc,p)=>acc+resid[p][i]*wq,0));
            const varOf=(x)=>{
              const srt=[...x].sort((a,b)=>a-b);
              const q=srt[Math.floor(srt.length*0.05)];
              const tail=srt.filter(v=>v<=q);
              return {v:-q, es:-(tail.reduce((a,b)=>a+b,0)/(tail.length||1))};
            };
            const compOf=(M,vf)=>{
              const rf=M===resid?residR:fundR;
              const mu=rf.reduce((a,b)=>a+b,0)/rf.length;
              const vv=rf.reduce((a,b)=>a+(b-mu)*(b-mu),0)/(rf.length-1);
              const o={};
              covered.forEach(p=>{
                const x=M[p], mx=x.reduce((a,b)=>a+b,0)/x.length;
                let c=0; for(let i=0;i<x.length;i++) c+=(x[i]-mx)*(rf[i]-mu);
                c/=(x.length-1);
                o[p]=vv>0? wq*c/vv*vf : 0;
              });
              return o;
            };
            const fv=varOf(fundR), rv=varOf(residR);
            const cRaw=compOf(series,fv.v), cRes=compOf(resid,rv.v);
            const varSummary={
              alpha:0.95, var:fv.v, es:fv.es, esOverVar:fv.es/fv.v,
              worst:-Math.min(...fundR), equalWeighted:true,
              byPod:covered.map(p=>({pod:p,
                share:cRaw[p]/fv.v, resShare:cRes[p]/rv.v}))
                .sort((a,b)=>b.share-a.share)
            };

            ret={pairs:cp, stats, unwind:un, covered:covered.length,
                 total:pods.length, meanCov, k, nullMeta, varSummary,
                 factors:bundle.factor_names.slice(0,k), days:bundle.dates.length};
          } else {
            ret={insufficient:true, meanCov, total:pods.length,
                 covered:covered.length};
          }
        }

        const B=sizes.reduce((a,b)=>a+b,0)/Math.max(pods.length,1);
        setRes({pods:pods.length, uni:uni.length, ladder, pairs, names,
                mgr, grid, gridNames, exit, ret,
                floor:B*B/Math.max(uni.length,1)/(2*B),
                inCash,
                assumed:rows.some(r=>r.assumed)});
      }catch(ex){ setErr(ex.message); }
      setBusy(false);
    },30);
  };

  // ---- thesis pass, run with the user's own key, in their browser
  const [bundle,setBundle]=useState(null);
  useEffect(()=>{
    fetch("data/demo_returns.json").then(r=>r.ok?r.json():null)
      .then(setBundle).catch(()=>setBundle(null));
  },[]);
  const [apiKey,setApiKey]=useState("");
  const [tBusy,setTBusy]=useState("");
  const [tRes,setTRes]=useState(null);
  const runTheses=async()=>{
    const pods=Object.keys(theses);
    if(!pods.length||!apiKey) return;
    setErr(null); setTRes(null);
    try{
      // THE CALENDAR WAS NOT REPRODUCIBLE AND THE DOCUMENTS ARE WHY. A memo
      // that says "December" and "late January" is unambiguous to the person
      // who wrote it and ambiguous to anything reading it later, because the
      // year is carried by the date on the letterhead. With no anchor the
      // extraction has to guess, and two runs over the SAME theses put
      // catalysts in different years - one run placed them in January 2024,
      // before the books existed. The pairs and the grouping were stable
      // across those runs; only the calendar moved, which is why it went
      // unnoticed.
      //
      // The fix is the anchor, not a firmer instruction. The as-of date is
      // the last date in the returns bundle when there is one, so catalysts
      // resolve against the same window the returns cover.
      // FALLING BACK TO TODAY MADE THE CALENDAR DRIFT. When a returns bundle
      // is present the as-of date comes from it and is fixed. When it is not -
      // which is the case on the published site, where the bundle is withheld
      // for licensing - the fallback was the system clock, so every catalyst
      // resolved relative to whenever the page happened to be opened. Loading
      // it in one month and the next produced different calendars from
      // identical documents, which is the same defect as the unseeded null
      // wearing different clothes.
      //
      // The fallback is now a fixed date rather than a moving one, and the
      // page states which date it used either way.
      const asOfFromData=!!(bundle&&bundle.dates&&bundle.dates.length);
      const asOf=asOfFromData ? bundle.dates[bundle.dates.length-1]
                              : "2024-12-31";
      const ext={};
      for(let i=0;i<pods.length;i++){
        setTBusy(`reading ${pods[i]} (${i+1}/${pods.length})`);
        ext[pods[i]]=await askClaude(apiKey, EXTRACT_SYS,
          `These positions are as of ${asOf}. Relative timing in the document `
          +`("December", "next quarter", "late January") is relative to that `
          +`date and must resolve forward from it. If a month is named with no `
          +`year, take the next occurrence of it after ${asOf}. If the timing `
          +`is genuinely vague ("in due course", "eventually"), return null `
          +`rather than choosing a date.\n\n---\n\n`+theses[pods[i]]);
      }
      setTBusy("grouping by shared driver");
      const lines=pods.map((p,i)=>
        `${i}. driver: ${ext[p].driver_plain} | mechanism: ${ext[p].mechanism}`
        +` | direction: ${ext[p].direction} | horizon: ${ext[p].horizon_quarters} quarters`);
      const cl=await askClaude(apiKey, CLUSTER_SYS,
        "The managers:\n\n"+lines.join("\n")+"\n\nGroup them by shared underlying cause.", 2500);

      // A manager can genuinely be in two bets, and the model is not told
      // otherwise. Keeping one label per manager silently dropped every group
      // but the last, so the group table could show a manager twice while the
      // pair logic knew only one of them - one artifact answering two ways.
      // Membership is a SET, and two managers share a bet when their sets
      // intersect.
      const grp={};
      (cl.groups||[]).forEach(g=>(g.members||[]).forEach(i=>{
        if(i>=0&&i<pods.length)
          (grp[pods[i]]=grp[pods[i]]||new Set()).add(g.group_id); }));
      const multi=pods.filter(p=>grp[p]&&grp[p].size>1);

      // long books from whatever positions were loaded
      const longsBy={};
      (rows||[]).forEach(r=>{ if(r.side==="long"){
        (longsBy[r.pod]=longsBy[r.pod]||new Set()).add(r.ticker); }});

      const cells=[];
      for(let i=0;i<pods.length;i++)
        for(let j=i+1;j<pods.length;j++){
          const p=pods[i], q=pods[j];
          const gp=grp[p], gq=grp[q];
          let shareGid=null;
          if(gp&&gq) gp.forEach(x=>{ if(gq.has(x)) shareGid=x; });
          const same=shareGid!==null&&ext[p].direction===ext[q].direction;
          const A=longsBy[p], B=longsBy[q];
          let jac=null;
          if(A&&B){ let n=0; A.forEach(x=>{if(B.has(x)) n++;});
                    jac=n/(A.size+B.size-n); }
          cells.push({a:p,b:q,shared:same,jac,
            cell: jac===null ? (same?"latent?":"—")
                 : (same&&jac>=0.05) ? "crowded"
                 : same ? "latent" : (jac>=0.05?"coincidental":"independent")});
        }

      const cal=[];
      pods.forEach(p=>(ext[p].catalysts||[]).forEach(c=>{
        if(c.approx_date) cal.push({pod:p, ...c}); }));
      cal.sort((x,y)=>x.approx_date<y.approx_date?-1:1);
      const byWeek={};
      cal.forEach(c=>{ const w=c.approx_date.slice(0,7);
        (byWeek[w]=byWeek[w]||new Set()).add(c.pod); });

      setTRes({ext, groups:cl.groups||[], cells, pods, cal, multi,
               asOf, asOfFromData,
               months:Object.entries(byWeek).map(([m,v])=>({m,pods:v.size}))
                 .sort((x,y)=>x.m<y.m?-1:1)});
      setTBusy("");
    }catch(ex){ setErr(String(ex.message||ex)); setTBusy(""); }
  };

  const sample=`pod,ticker,weight,side
pod_a,AAPL,0.05,long
pod_a,MSFT,0.04,long
pod_a,XOM,0.03,short
pod_b,AAPL,0.06,long
pod_b,NVDA,0.05,long
pod_b,KO,0.04,short`;

  return (
    <div className="panel">
      <h2>Run this on your own book</h2>
      <p className="note" style={{marginTop:2}}>
        Everything above is one simulated fund. The same aggregation runs on any
        book. Add a row per manager, give each one their positions and — if you
        have it — what they wrote. <strong>Press “+ add manager” for as many
        rows as you need.</strong> The thesis sits in the same row as the book,
        so which document belongs to which manager is stated rather than
        guessed at.
      </p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",
                   gap:"14px",marginTop:"12px"}}>
        <div>
          <div className="lbl" style={{marginBottom:6}}>positions file</div>
          <pre style={{margin:0,padding:"10px 12px",background:"#f6f7f9",
                       border:"1px solid var(--line)",borderRadius:"7px",
                       font:"11.5px ui-monospace,Menlo,monospace",overflowX:"auto"}}>
{`jsmith.csv
ticker,weight,side
AAPL,0.05,long
NVDA,0.04,long
XOM,0.03,short`}
          </pre>
          <p className="note" style={{marginTop:6}}>
            No <code>pod</code> column needed — the row already says whose book
            it is. Leave the name blank and the file name fills it in.
          </p>
        </div>
        <div>
          <div className="lbl" style={{marginBottom:6}}>thesis file</div>
          <pre style={{margin:0,padding:"10px 12px",background:"#f6f7f9",
                       border:"1px solid var(--line)",borderRadius:"7px",
                       font:"11.5px ui-monospace,Menlo,monospace",overflowX:"auto"}}>
{`jsmith.md

MANDATE
Long/short equity, gross to 200%,
net +20 to +60%, no single name
above 8% of NAV.

THESIS
The hyperscaler capex cycle is in
its second inning, not its seventh…

CATALYSTS
Q4 results, late October.
FERC queue data, December.`}
          </pre>
          <p className="note" style={{marginTop:6}}>
            Any prose will do — a mandate, a pitch, a monthly note. Headings
            are not required; the extraction reads whatever is there.
          </p>
        </div>
      </div>
      <p className="note">
        <code>ticker</code> is the only required column. Instead of{" "}
        <code>weight</code> you may give <code>nominal</code> and{" "}
        <code>nav</code> and the weight is derived; instead of{" "}
        <code>side</code> a negative weight is read as a short. If weight is
        missing entirely each leg is assumed equal-weighted and the output says
        so, because a crowding number computed on assumed weights is not the
        same number as one computed on real ones.
      </p>
      <p className="note">
        <strong>Nothing is uploaded.</strong> This page is a static file with no
        server behind it; the parsing and the permutation null both run in your
        browser and the positions never leave the machine. That is not a
        courtesy — a real position file is the most confidential document a fund
        has, and a tool that posts one anywhere is a tool nobody can use.
      </p>
      <table style={{marginTop:14}}>
        <thead><tr>
          <th style={{width:"22%"}}>Manager</th>
          <th style={{textAlign:"left"}}>Positions (.csv)</th>
          <th style={{textAlign:"left"}}>What they wrote (.md / .txt)</th>
          <th style={{width:"1%"}}></th>
        </tr></thead>
        <tbody>{slots.map(sl=>(
          <tr key={sl.id}>
            <td>
              <input value={sl.name} placeholder="name or desk"
                     onChange={e=>rename(sl.id,e.target.value)}
                     style={{font:"12.5px ui-monospace,Menlo,monospace",
                             padding:"4px 8px",width:"100%",
                             border:"1px solid var(--line)",borderRadius:"6px"}}/>
            </td>
            <td style={{textAlign:"left"}}>
              <input type="file" accept=".csv,.txt"
                     onChange={e=>loadPositions(sl.id,e.target.files[0])}
                     style={{font:"11.5px ui-monospace,Menlo,monospace",maxWidth:"210px"}}/>
              {sl.posRows.length>0 && (
                <span className="counter" style={{marginLeft:6}}>
                  {sl.posRows.length} rows
                  {sl.posRows.every(r=>r.nominal!=null)?" · currency":" · weight only"}
                </span>)}
            </td>
            <td style={{textAlign:"left"}}>
              <input type="file" accept=".md,.txt"
                     onChange={e=>loadThesis(sl.id,e.target.files[0])}
                     style={{font:"11.5px ui-monospace,Menlo,monospace",maxWidth:"210px"}}/>
              {sl.thesis && (
                <span className="counter" style={{marginLeft:6}}>
                  {sl.thesis.split(/\s+/).length} words
                </span>)}
            </td>
            <td>
              <button className="btn" onClick={()=>dropSlot(sl.id)}
                      title="remove this manager"
                      style={{padding:"2px 8px"}}>&times;</button>
            </td>
          </tr>))}
        </tbody>
      </table>

      <div className="bar">
        <button className="btn" onClick={addSlot}
                style={{fontWeight:700}}>+ add manager</button>
        <button className="btn" onClick={run} disabled={!rows||busy}>
          {busy?"working…":"Analyse positions"}
        </button>
        <button className="btn" onClick={()=>{
          [["jsmith.csv","ticker,weight,nav,side\nAAPL,0.22,300000000,long\nNVDA,0.20,300000000,long\nVRT,0.18,300000000,long\nETN,0.20,300000000,long\nSMCI,0.20,300000000,long\nXOM,0.25,300000000,short\nKO,0.25,300000000,short\nPG,0.25,300000000,short\nCL,0.25,300000000,short"],
           ["mchen.csv","ticker,weight,nav,side\nAAPL,0.25,120000000,long\nVRT,0.25,120000000,long\nETN,0.25,120000000,long\nPWR,0.25,120000000,long\nKO,0.34,120000000,short\nPG,0.33,120000000,short\nGIS,0.33,120000000,short"],
           ["rpatel.csv","ticker,weight,nav,side\nJPM,0.28,80000000,long\nBAC,0.24,80000000,long\nWFC,0.24,80000000,long\nC,0.24,80000000,long\nTLT,0.50,80000000,short\nGLD,0.50,80000000,short"]]
          .forEach(([n,t])=>{
            const b=new Blob([t],{type:"text/csv"});
            const u=URL.createObjectURL(b); const a2=document.createElement("a");
            a2.href=u; a2.download=n; a2.click(); URL.revokeObjectURL(u);
          });
        }}>example files</button>
        <span className="counter">
          {err?<span style={{color:"var(--crowd)"}}>{err}</span>
             :rows?`${rows.length} positions across ${new Set(rows.map(r=>r.pod)).size} managers`
             :"add a manager and load their book"}
        </span>
      </div>

      <h2 style={{fontSize:"15px",marginTop:20}}>Then read what they wrote</h2>
      <p className="note" style={{marginTop:2}}>
        A second, separate step — because the first one is free and stays on
        this machine, and this one is neither. Two prompts, the same ones{" "}
        <code>scripts/pods7_thesis_risk.py</code> sends: one reduces each
        document to a structured claim, the second sees every claim at once and
        groups the managers whose bets would be proved right or wrong by the
        same event. That reaches pairs betting on one cause through names that
        do not overlap at all — which no amount of position analysis can.
      </p>
      <p className="note" style={{color:"var(--crowd)"}}>
        <strong>Positions stay in your browser. Thesis text does not.</strong>{" "}
        This step sends each document to Anthropic's API with the key you paste
        below. The key lives in this page's memory, is stored nowhere, and dies
        with the tab — but the documents leave the machine. At a real fund that
        is a decision for compliance rather than for a web page, and the honest
        answer there is to run the script against a model inside your own
        perimeter.
      </p>
      <div className="bar">
        <input type="password" value={apiKey} placeholder="sk-ant-…"
               onChange={e=>setApiKey(e.target.value)}
               style={{font:"12px ui-monospace,Menlo,monospace",padding:"5px 9px",
                       border:"1px solid var(--line)",borderRadius:"7px",width:"240px"}}/>
        <button className="btn" onClick={runTheses}
                disabled={!apiKey||!Object.keys(theses).length||!!tBusy}>
          {tBusy?tBusy:`Read ${Object.keys(theses).length} thesis file(s)`}
        </button>
        <span className="counter">
          {Object.keys(theses).length
            ? Object.keys(theses).join(", ")
            : "no thesis files loaded"}
        </span>
      </div>

      {res && (
        <React.Fragment>
          {res.assumed && (
            <p className="note" style={{color:"var(--crowd)"}}>
              Some rows had no weight, so those legs were treated as equal
              weighted. Every number below inherits that assumption.
            </p>
          )}
          <p className="note" style={{color:res.inCash?"inherit":"var(--crowd)"}}>
            {res.inCash
              ? "Exposures are in currency, so pods of different sizes are weighted correctly against each other."
              : "No nominal or nav column, so exposures are fractions of each pod's own NAV — which treats every pod as the same size. A 500m book and a 50m book both showing 5% in a name are 25m and 2.5m of real exposure, and the tables below cannot tell them apart. Add nominal, or weight and nav, to fix this."}
          </p>
          <h2 style={{fontSize:"15px",marginTop:18}}>Each manager on their own</h2>
          <p className="note" style={{marginTop:2}}>

          <table>

          <h2 style={{fontSize:"15px",marginTop:20}}>Who is in which name</h2>
          <p className="note" style={{marginTop:2}}>
            The most-pressured names against every manager. Filled square is
            long, hollow is short, blank is not held. No test and no null —
            just the books side by side, which is the raw fact everything else
            on this page summarises.
          </p>
          <div style={{overflowX:"auto"}}>
          {(()=>{
            const G=res.grid, N=res.gridNames;

            <svg viewBox={`0 0 ${W} ${H}`}
