                          fill={c>0?"var(--crowd)":"none"}
                          stroke={c>0?"none":"#9aa1a9"} strokeWidth="1"
                          opacity={c>0?.85:.8}/>))}
                </g>))}
            </svg>);})()}
          </div>

          {res.ret && res.ret.insufficient && (
            <p className="note" style={{color:"var(--crowd)",marginTop:16}}>
              <strong>Return-based analyses not run.</strong> Only{" "}
              {(res.ret.meanCov*100).toFixed(0)}% of the uploaded book resolves
              against the return history this page ships, and{" "}
              {res.ret.covered} of {res.ret.total} managers clear the{" "}
              {(COVERAGE_FLOOR*100).toFixed(0)}% coverage floor. Below that a
              residual correlation is computed on a fraction of a book and
              looks identical to one computed on all of it, so it is refused
              rather than shown with a caveat. The demo pack in{" "}
              <code>demo/</code> resolves fully.
            </p>
          )}

          {res.ret && !res.ret.insufficient && (()=>{
            const R2=res.ret, W=700,H=300,P={t:16,r:16,b:44,l:56};
            const lim=Math.max(0.4,...R2.pairs.map(p=>Math.max(Math.abs(p.raw),Math.abs(p.resid))))*1.15;
            const x=v=>P.l+((v+lim)/(2*lim))*(W-P.l-P.r);
            const y=v=>P.t+(1-(v+lim)/(2*lim))*(H-P.t-P.b);
            const f=v=>(v>=0?"+":"")+v.toFixed(3);
            return (
            <React.Fragment>
              <hr/>
              <h2 style={{fontSize:"15px"}}>What the correlation matrix sees,
                and what is actually shared</h2>
              <p className="note" style={{marginTop:2}}>
                These four run only because the names in these books resolve
                against {R2.days.toLocaleString()} days of return history this
                page ships with the demo pack. {R2.covered} of {R2.total}{" "}
                managers clear the {(COVERAGE_FLOOR*100).toFixed(0)}% coverage
                floor, at {(R2.meanCov*100).toFixed(0)}% mean coverage. Upload a
                book of names outside that set and this section disappears
                rather than guessing.
              </p>
              <table>
                <thead><tr><th>Manager</th><th>Ann return</th><th>Ann vol</th>
                  <th>Sharpe</th><th>Names resolved</th></tr></thead>
                <tbody>{R2.stats.map(s2=>(
                  <tr key={s2.pod}>
                    <td className="v">{s2.pod}</td>
                    <td className={"v "+(s2.ann>=0?"pos":"neg")}>{(s2.ann*100).toFixed(1)}%</td>
                    <td className="v">{(s2.vol*100).toFixed(1)}%</td>
                    <td className="v">{s2.sharpe.toFixed(2)}</td>
                    <td className="v">{(s2.cov*100).toFixed(0)}%</td>
                  </tr>))}
                </tbody>
              </table>

              <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",marginTop:14}}
                   role="img" aria-label="raw against residual correlation">
                {[-0.5,0,0.5].filter(t=>Math.abs(t)<lim).map(t=>(
                  <g key={t}>
                    <line className="gl" x1={x(t)} x2={x(t)} y1={P.t} y2={H-P.b}/>
                    <line className="gl" x1={P.l} x2={W-P.r} y1={y(t)} y2={y(t)}/>
                    <text className="axis" x={x(t)} y={H-P.b+15} textAnchor="middle">{t}</text>
                    <text className="axis" x={P.l-7} y={y(t)+3} textAnchor="end">{t}</text>
                  </g>))}
                <line x1={x(-lim)} y1={y(-lim)} x2={x(lim)} y2={y(lim)}
                      stroke="#c3c8cf" strokeDasharray="4 4"/>
                {R2.pairs.map((p,i)=>{
                  const latent=p.jac<0.05&&p.raw>0.3;
                  return (
                  <g key={i}>
                    <circle cx={x(p.raw)} cy={y(p.resid)} r={p.jac>=0.05?5:4.5}
                            fill={p.jac>=0.05?"var(--crowd)":latent?"var(--factor)":"var(--indep)"}
                            stroke={latent?"var(--hl)":"none"} strokeWidth="2.4"
                            opacity=".85"/>
                    {(p.jac>=0.05||p.flag) &&
                      <text className="axis" x={x(p.raw)+8} y={y(p.resid)+3}>
                        {p.a} · {p.b}</text>}
                  </g>);})}
                <text className="axis" x={W/2} y={H-8} textAnchor="middle">
                  return correlation</text>
                <text className="axis" x={14} y={H/2} textAnchor="middle"
                      transform={`rotate(-90 14 ${H/2})`}>residual correlation</text>
              </svg>
              <table>
                <thead><tr><th>Pair</th><th>Book overlap</th>
                  <th>Return corr</th><th>Residual corr</th><th>Reading</th></tr></thead>
                <tbody>{[...R2.pairs].sort((a,b)=>b.raw-a.raw).slice(0,10).map((p,i)=>(
                  <tr key={i}>
                    <td className="v">{p.a} · {p.b}</td>
                    <td className="v">{(p.jac*100).toFixed(1)}%</td>
                    <td className="v">{f(p.raw)}</td>
                    <td className={"v "+(p.flag?"neg":"")}>{f(p.resid)}
                      <span className="axis" style={{marginLeft:6}}>
                        {p.p<0.001?"p<0.001":"p="+p.p.toFixed(3)}</span></td>
                    <td>{p.crowded?"shared names and shared risk"
                        :p.sharedRisk?"shared risk, no shared names"
                        :p.offset?"offsetting — each other's hedge"
                        :p.raw>0.3?"shared factor only"
                        :"unrelated"}</td>
                  </tr>))}
                </tbody>
              </table>
              <p className="note">
                Horizontal is plain return correlation, the number a standard
                risk report ranks on. Vertical is what survives after common
                factor exposure is regressed out, refitted every 63 days because
                a loading changes whenever the book does. A pair sitting far
                right and near zero is a shared <em>factor</em> — hedge it
                centrally, do not ask anyone to cut. A pair that stays high
                vertically is shared idiosyncratic risk, which is the one that
                needs a position change.
              </p>
              <p className="note">
                <strong>How a pair is classified.</strong> Each residual
                correlation is compared against a circular block bootstrap —
                each manager's residual series is re-cut into {R2.nullMeta.block}-day
                blocks and reassembled, which keeps that book's own dynamics
                and destroys only the alignment between books. Every pair's
                draws are pooled into one reference distribution of{" "}
                {R2.nullMeta.nRef.toLocaleString()} values, and the p-values go
                through Benjamini-Hochberg at {R2.nullMeta.alpha} across all{" "}
                {R2.pairs.length} pairs. {R2.nullMeta.nSig} cleared it.
              </p>
              <p className="note">
                <strong>Crowded needs two things, not one.</strong> A pair is
                called <em>shared names and shared risk</em> only when the
                residual correlation is significant <em>and</em> the books
                actually overlap — the same rule the Python pipeline applies,
                for the same reason. A correlated residual on its own can be a
                factor the model missed, and requiring overlap too is what
                keeps false positives at zero. {R2.nullMeta.nCrowd} pair
                {R2.nullMeta.nCrowd===1?"":"s"} here.
              </p>
              <p className="note">
                <strong>A significant residual with no shared names is a
                different finding, not a weaker one.</strong> It does not get a
                lower bar and it does not get called crowding. Two managers
                whose books move together while holding nothing in common need
                a different response from two managers in the same names: one
                is an exit problem you solve by cutting, the other is a
                correlation you hedge or accept, and neither remedy works on
                the other case. {R2.nullMeta.nRisk} pair
                {R2.nullMeta.nRisk===1?"":"s"} land here — the cell the Python
                pipeline cannot reach at all, because zero overlap can never
                clear its second gate.
              </p>
              <p className="note">
                <strong>A significant NEGATIVE residual is not shared risk at
                all.</strong> The null is two-sided, because a correlation far
                from zero in either direction is a real relationship — but the
                reading is not symmetric. Two books that offset each other once
                the factors are stripped are each other's hedge, and telling a
                risk desk they share risk would point it at the opposite of what
                is happening. {R2.nullMeta.nOff} pair
                {R2.nullMeta.nOff===1?" is":"s are"} labelled offsetting here.
                An earlier version of this table called them shared risk, and
                the demo pack is what caught it.
              </p>
              <p className="note">
                For context rather than as a gate: the median absolute residual
                across every pair is{" "}
                <strong>{R2.nullMeta.baseline.toFixed(3)}</strong>. That is what{" "}
                {R2.k} factors failed to remove, measured on this fund rather
                than assumed. Every pair carries it, so a flagged pair sitting
                barely above it is worth reading twice — over{" "}
                {R2.days.toLocaleString()} days the null will call almost any
                correlation above roughly 0.06 significant, because what it
                tests is <em>independence</em>, and books that still share
                unmodelled exposure are not independent.
              </p>

              {R2.varSummary && (
                <React.Fragment>
                  <h2 style={{fontSize:"15px",marginTop:22}}>Value at Risk</h2>
                  <p className="note">
                    The worst day in twenty, from the actual return history of
                    these books rather than from a normal distribution. VaR{" "}
                    <strong>{(R2.varSummary.var*100).toFixed(2)}%</strong>,
                    expected shortfall{" "}
                    <strong>{(R2.varSummary.es*100).toFixed(2)}%</strong>, a
                    ratio of {R2.varSummary.esOverVar.toFixed(2)} against about
                    1.25 for a normal distribution. Worst single day in the
                    sample, {(R2.varSummary.worst*100).toFixed(2)}%.
                  </p>
                  <p className="note">
                    <strong>Managers are weighted equally, because a position
                    file does not say how the fund allocates.</strong> Real
                    weights would change every number in this table, so read the
                    ordering rather than the levels.
                  </p>
                  <table>
                    <thead><tr><th>Manager</th>
                      <th className="v">Share of VaR</th>
                      <th className="v">After factors removed</th></tr></thead>
                    <tbody>
                      {R2.varSummary.byPod.map(d=>(
                        <tr key={d.pod}>
                          <td>{d.pod}</td>
                          <td className="v">{(d.share*100).toFixed(1)}%</td>
                          <td className={"v "+(d.resShare>d.share?"neg":"")}>
                            {(d.resShare*100).toFixed(1)}%</td>
                        </tr>))}
                    </tbody>
                  </table>
                  <p className="note">
                    A manager whose share <em>rises</em> once factors are
                    removed is carrying risk that is their own rather than the
                    market's — those rows are marked. A manager whose share
                    falls was mostly contributing shared exposure, which a fund
                    can hedge centrally without asking anyone to change a
                    position. VaR alone does not distinguish the two, which is
                    the reason for the second column.
                  </p>
                </React.Fragment>
              )}

              <h2 style={{fontSize:"15px",marginTop:20}}>Priced unwind</h2>
              <table>
                <thead><tr><th>If this manager is liquidated</th>
                  <th>Cost to the others</th></tr></thead>
                <tbody>{R2.unwind.map(u=>(
                  <tr key={u.pod}>
                    <td className="v">{u.pod}</td>
                    <td className={"v "+(u.damage<0?"neg":"")}>
                      {(u.damage/1e6).toFixed(2)}m</td>
                  </tr>))}
                </tbody>
              </table>
              <p className="note">
                Square-root impact on each name's own realised volatility, with
                capacity proxied at 0.5% of market capitalisation a day because
                CRSP carries no volume. The ordering is the result; the dollar
                figures move with that liquidity assumption and are a scenario
                rather than an estimate.
              </p>
            </React.Fragment>);})()}

          <h2 style={{fontSize:"15px",marginTop:20}}>If one manager is forced out</h2>
          <p className="note" style={{marginTop:2}}>
            A stop-loss is automatic and nobody votes on it. If a manager is
            liquidated, every other manager long the same names is marked at
            whatever that selling does to the price. This ranks who would be
            selling into whom. It is exposure at risk, not a loss estimate —
            turning it into a number needs each name's volatility and a
            liquidity proxy, which a position file does not carry.
          </p>
          <table>
            <thead><tr><th>If this manager is liquidated</th><th>They sell</th>
              <th>Others exposed to the same names</th><th>Managers hit</th></tr></thead>
            <tbody>{res.exit.map(e=>{
              const f=v=>res.inCash?(v/1e6).toFixed(1)+"m":v.toFixed(2);
              return (<tr key={e.pod}>
                <td className="v">{e.pod}</td>
                <td className="v">{f(e.sold)}</td>
                <td className={"v "+(e.others>0?"neg":"")}>{f(e.others)}</td>
                <td className="v">{e.nHit}
                  {e.top.length?" · "+e.top.map(t=>t.pod).join(", "):""}</td>
              </tr>);})}
            </tbody>
          </table>
          {res.exit[0] && res.exit[0].others>0 && (
            <p className="note">
              <strong>{res.exit[0].pod}</strong> is the expensive one to lose:
              their forced exit puts{" "}
              {res.inCash?(res.exit[0].others/1e6).toFixed(1)+"m":res.exit[0].others.toFixed(2)}{" "}
              of other managers' positions into the same selling, across{" "}
              {res.exit[0].nHit} book{res.exit[0].nHit>1?"s":""}. Note this is
              not the manager with the largest book — it is the one whose book
              other people share.
            </p>
          )}

          <hr/>
          <p className="note">
            {res.pods} pods over {res.uni} distinct names. Two unrelated books
            of this size share roughly{" "}
            <strong>{(res.floor*100).toFixed(1)}%</strong> of their long names
            by chance alone — the floor any crowding number has to clear.
          </p>
          <p className="note">
            <strong>This test has little power on a small fund, and that is not
            a defect in the arithmetic.</strong> The floor is the genuine chance
            level for books of this size drawn from {res.uni} names; it is high
            because the universe is small, and the universe is small because a
            position file says nothing about what else was on the menu. With six
            managers the ladder can miss crowding that is really there — on the
            demo pack, where a crowded pair is planted and known, the t = 2 row
            lands near p = 0.05 rather than clearing it comfortably.
          </p>
          <p className="note">
            So read a null result here as <em>not shown</em> rather than{" "}
            <em>not present</em>, and let the pair table below carry the weight:
            a single pair well above its own floor is the more reliable signal at
            this size. The ladder becomes the better instrument as the number of
            managers grows.
          </p>
          <p className="note">
            <strong>This null is seeded, so reloading cannot change the
            answer.</strong> It previously was not, and the demo pack exposed
            it: two consecutive runs on identical books returned p = 0.030 and
            p = 0.060, one either side of the conventional threshold. The draw
            count is now {nPerm.toLocaleString()} rather than 200, which is the
            part that actually shrinks the sampling error — a fixed seed only
            makes the estimate repeatable, not more accurate, and a different
            seed would still give a slightly different number. Read a p near
            0.05 here as near 0.05, never as a verdict that fell one side of a
            line.
          </p>

          {res.ladder.length>1 && (()=>{
            const L=res.ladder, W=700,H=210,P={t:14,r:14,b:38,l:48};
            const mx=Math.max(...L.map(d=>Math.max(d.real,d.chance)))*1.1||1;
            const x=t=>P.l+((t-L[0].t)/Math.max(1,L.length-1))*(W-P.l-P.r);
            const y=v=>P.t+(1-v/mx)*(H-P.t-P.b);
            const pth=k=>L.map((d,i)=>(i?"L":"M")+x(d.t).toFixed(1)+" "+y(d[k]).toFixed(1)).join(" ");
            return (
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",marginTop:12}}
                 role="img" aria-label="crowding against chance">
              {[0,0.25,0.5,0.75].filter(v=>v<mx).map(v=>(
                <g key={v}>
                  <line className="gl" x1={P.l} x2={W-P.r} y1={y(v)} y2={y(v)}/>
                  <text className="axis" x={P.l-6} y={y(v)+3} textAnchor="end">{Math.round(v*100)}%</text>
                </g>))}
              <path d={pth("chance")} fill="none" stroke="#9aa1a9" strokeWidth="1.8" strokeDasharray="5 4"/>
              <path d={pth("real")} fill="none" stroke="var(--crowd)" strokeWidth="2.4"/>
              {L.map(d=>(<g key={d.t}>
                <circle cx={x(d.t)} cy={y(d.real)} r="3.4" fill="var(--crowd)"/>
                <circle cx={x(d.t)} cy={y(d.chance)} r="2.6" fill="#9aa1a9"/>
                <text className="axis" x={x(d.t)} y={H-P.b+15} textAnchor="middle">{d.t}</text>
              </g>))}
              <text className="axis" x={W/2} y={H-6} textAnchor="middle">
                held long by t or more managers — solid is your book, dashed is chance
              </text>
            </svg>);})()}

          <table>
            <thead><tr><th>t</th><th>Share of gross in names held by t+ pods</th>
              <th>Chance</th><th>Excess</th><th>p</th></tr></thead>
            <tbody>{res.ladder.map(l=>{
              const dead=l.real<0.001&&l.chance<0.001;
              const floored=l.p<=1.5/(nPerm+1);
              return (
              <tr key={l.t} style={dead?{opacity:.45}:null}>
                <td className="v">{l.t}</td>
                <td className="v">{(l.real*100).toFixed(1)}%</td>
                <td className="v">{(l.chance*100).toFixed(1)}%</td>
                <td className={"v "+(!dead&&l.real>l.chance?"pos":"")}>
                  {dead?"—":((l.real-l.chance>=0?"+":"")+((l.real-l.chance)*100).toFixed(1)+"pp")}</td>
                <td className="v">{dead?"—":floored?"<"+(1.5/(nPerm+1)).toFixed(3):l.p.toFixed(3)}</td>
              </tr>);})}
            </tbody>
          </table>

          <h2 style={{fontSize:"15px",marginTop:20}}>Most one-way pressure</h2>
          <p className="note" style={{marginTop:2}}>
            Each dot is a name. Horizontal is how much the fund holds in it;
            vertical is how much of that is one-way. A dot on the diagonal is
            held long by everyone who holds it. A dot well below it has longs
            and shorts inside the fund that cancel on paper and would not
            cancel in an exit.
          </p>
          {(()=>{
            const N=res.names, W=700,H=250,P={t:14,r:16,b:40,l:56};
            const mg=Math.max(...N.map(n=>n.gross))*1.1||1;
            const x=v=>P.l+(v/mg)*(W-P.l-P.r);
            const y=v=>P.t+(1-v/mg)*(H-P.t-P.b);
            const fmt=v=>res.inCash?(v/1e6).toFixed(0)+"m":v.toFixed(2);
            return (
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",marginTop:8}}
                 role="img" aria-label="one-way pressure against gross">
              <line x1={x(0)} y1={y(0)} x2={x(mg)} y2={y(mg)}
                    stroke="#c3c8cf" strokeDasharray="4 4"/>
              {[0.25,0.5,0.75,1].map(f=>(
                <g key={f}>
                  <line className="gl" x1={P.l} x2={W-P.r} y1={y(mg*f)} y2={y(mg*f)}/>
                  <text className="axis" x={P.l-6} y={y(mg*f)+3} textAnchor="end">{fmt(mg*f)}</text>
                  <text className="axis" x={x(mg*f)} y={H-P.b+15} textAnchor="middle">{fmt(mg*f)}</text>
                </g>))}
              {(()=>{
                // Equal-weighted books put several names at exactly the same
                // point, and four labels printed at one coordinate render as
                // an unreadable smear. Names within a few pixels are collapsed
                // into one label listing them.
                const seen=[];
                N.filter(n=>n.n>=2).forEach(n=>{
                  const cx=x(n.gross), cy=y(n.press);
                  const near=seen.find(g=>Math.abs(g.cx-cx)<7&&Math.abs(g.cy-cy)<7);
                  if(near) near.names.push(n.ticker);
                  else seen.push({cx,cy,names:[n.ticker],r:3+n.n});
                });
                return (<React.Fragment>
                  {N.map(n=>(
                    <circle key={n.ticker} cx={x(n.gross)} cy={y(n.press)} r={3+n.n}
                            fill={n.n>=2?"var(--crowd)":"var(--indep)"}
                            opacity={n.n>=2?.75:.5}/>))}
                  {seen.map((g,i)=>(
                    <text key={i} className="axis" x={g.cx+6+g.r} y={g.cy+3}>
                      {g.names.length>3
                        ? g.names.slice(0,3).join(" ")+" +"+(g.names.length-3)
                        : g.names.join(" ")}
                    </text>))}
                </React.Fragment>);
              })()}
              <text className="axis" x={W/2} y={H-6} textAnchor="middle">
                gross exposure — dot size is how many managers are long it
              </text>
            </svg>);})()}
          <table>
            <thead><tr><th>Ticker</th><th>Pods long</th><th>Long pressure</th>
              <th>Net</th><th>Gross</th><th>Net / gross</th></tr></thead>
            <tbody>{res.names.map(n=>{
              const r=n.gross?n.net/n.gross:0;
              return (<tr key={n.ticker}>
                <td className="v">{n.ticker}</td>
                <td className="v">{n.n}</td>
                <td className="v">{res.inCash?(n.press/1e6).toFixed(1)+"m":n.press.toFixed(3)}</td>
                <td className="v">{res.inCash?(n.net/1e6).toFixed(1)+"m":n.net.toFixed(3)}</td>
                <td className="v">{res.inCash?(n.gross/1e6).toFixed(1)+"m":n.gross.toFixed(3)}</td>
                <td className="v" style={{color:Math.abs(r)<0.5?"var(--crowd)":"inherit"}}>
                  {Math.round(r*100)}%</td>
              </tr>);})}
            </tbody>
          </table>

          <h2 style={{fontSize:"15px",marginTop:20}}>Most overlapping pairs</h2>
          {(()=>{
            const P2=res.pairs.slice(0,8).filter(p=>p.jac>0);
            if(!P2.length) return null;
            const mx=Math.max(...P2.map(p=>p.jac));
            return (
            <svg viewBox={`0 0 700 ${20+P2.length*22}`}
                 style={{width:"100%",height:"auto",marginTop:8}}
                 role="img" aria-label="pairwise overlap">
              {P2.map((p,i)=>(
                <g key={i} transform={`translate(0 ${i*22})`}>
                  <text className="axis" x="0" y="15">{p.a} · {p.b}</text>
                  <rect x="170" y="4" width={Math.max(2,p.jac/mx*280)} height="13" rx="2"
                        fill={p.jac>res.floor*2?"var(--crowd)":"#b9bec5"}
                        opacity={p.jac>res.floor*2?.9:.7}/>
                  {/* The bar ran to 380px and the label started after it, so a
                      long label on a full-width bar was cut off by the right
                      edge of the viewBox - the widest bar, which is always the
                      most crowded pair, was the one whose text got truncated.
                      Bar shortened and label abbreviated so the worst case
                      fits. */}
                  <text className="axis" x={178+Math.max(2,p.jac/mx*280)} y="15">
                    {(p.jac*100).toFixed(1)}% · {p.shared} names
                    {res.floor>0?" · "+(p.jac/res.floor).toFixed(1)+"× floor":""}
                  </text>
                </g>))}
              <line x1={170+res.floor/mx*280} x2={170+res.floor/mx*280}
                    y1="0" y2={P2.length*22} stroke="var(--ink)"
                    strokeDasharray="3 3" opacity=".5"/>
            </svg>);})()}
          <p className="note">
            The dotted line is the chance floor — overlap two unrelated books of
            this size would show anyway. Bars left of it are arithmetic.
          </p>
          <table>
            <thead><tr><th>Pair</th><th>Shared long names</th><th>Overlap</th>
              <th>Against the floor</th></tr></thead>
            <tbody>{res.pairs.slice(0,10).map((p,i)=>(
              <tr key={i}>
                <td className="v">{p.a} · {p.b}</td>
                <td className="v">{p.shared}</td>
                <td className="v">{(p.jac*100).toFixed(1)}%</td>
                <td className={"v "+(p.jac>res.floor*2?"neg":"")}>
                  {res.floor>0?(p.jac/res.floor).toFixed(1)+"×":"—"}</td>
              </tr>))}
            </tbody>
          </table>

          <p className="note">
            <strong>What positions alone cannot tell you.</strong> The
            factor separation needs each pod's daily return history, and the
            unwind needs each name's volatility and a liquidity proxy. Neither
            is in a position file, so splitting shared factor exposure from
            genuine crowding, and pricing a forced exit, are not run here. Add
            returns and the Python pipeline in this repository does both.
            Saying which half is missing is more use than a number that looks
            complete and is not.
          </p>
        </React.Fragment>
      )}

      {tRes && (
        <React.Fragment>
          <table>
            <thead><tr><th>Shared cause</th><th>Managers</th><th>Confidence</th></tr></thead>
            <tbody>{tRes.groups.filter(g=>(g.members||[]).length>1).map((g,i)=>(
              <tr key={i}>
                <td>{g.plain}</td>
                <td>{(g.members||[]).map(m=>(
                  <span key={m} className="tag t-crowded" style={{marginRight:4}}>
                    {tRes.pods[m]}</span>))}</td>
                <td className="v">{g.confidence}</td>
              </tr>))}
              {!tRes.groups.filter(g=>(g.members||[]).length>1).length && (
                <tr><td colSpan="3" className="axis">
                  No two managers are betting on the same cause. Reported as
                  found — a grouping pass that never returns a group of one is
                  a pass that will invent crowding.
                </td></tr>)}
            </tbody>
          </table>

          <p className="note">
            Each document was reduced to a structured claim — driver, direction,
            mechanism, dated catalysts, falsifier — and then every claim was shown
            to the model at once and grouped by whether one event would prove them
            right or wrong together. The pass compares; it does not name. An
            earlier design asked each document in isolation to invent a label that
            would coincidentally match another document's label, and five managers
            on one bet produced five different labels.
          </p>
          <p className="note">
            The model is told to use only what the documents state and not to
            import what it knows about any real company, so a group has to come
            from what a manager wrote about a ticker rather than from the model
            recognising the ticker. That is what makes a group traceable to a
            sentence. It is a prompt, not a guarantee, and it is the first thing
            to attack if a group looks wrong. Confidence is the model's confidence
            in the claim it extracted, not in whether the bet is any good.
          </p>
          {tRes.multi&&tRes.multi.length>0&&(
            <p className="note">
              <strong>{tRes.multi.join(", ")}</strong>{" "}
              {tRes.multi.length>1?"appear":"appears"} in more than one group.
              Nothing forbids that and a manager genuinely can be running two
              bets, so membership is treated as a set: two managers share a bet
              when their groups intersect. Worth reading those rows twice — a
              manager in several groups is either running several bets or was
              described vaguely enough to fit several.
            </p>
          )}

          {(()=>{
            // Two axes as a picture: every pair placed by how much its books
            // overlap and whether the managers are making one bet. The top-left
            // quadrant is the one no position report reaches.
            const C=tRes.cells.filter(c=>c.jac!==null);
            if(!C.length) return null;
            const W=700,H=250,P={t:16,r:16,b:42,l:60};
            const mx=Math.max(0.1,...C.map(c=>c.jac))*1.15;
            const x=v=>P.l+(v/mx)*(W-P.l-P.r);
            const rowY=b=>b?P.t+42:H-P.b-42;
            return (
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",marginTop:14}}
                 role="img" aria-label="thesis overlap against book overlap">
              <line x1={P.l} x2={W-P.r} y1={(rowY(true)+rowY(false))/2}
                    y2={(rowY(true)+rowY(false))/2} stroke="#dfe3e8"/>
              <text className="axis" x="0" y={rowY(true)+3}>same bet</text>
              <text className="axis" x="0" y={rowY(false)+3}>different bets</text>
              {[0,0.25,0.5,0.75,1].filter(f=>f*mx<=mx).map(f=>(
                <g key={f}>
                  <line className="gl" x1={x(mx*f)} x2={x(mx*f)} y1={P.t} y2={H-P.b}/>
                  <text className="axis" x={x(mx*f)} y={H-P.b+15} textAnchor="middle">
                    {(mx*f*100).toFixed(0)}%</text>
                </g>))}
              {(()=>{
                // The latent pairs all sit at 0% overlap by definition, so a
                // pseudo-random jitter stacked them on the same pixel and the
                // labels overprinted. Pairs are bucketed by x and each bucket
                // fans out in a fixed vertical order instead.
                const bucket={};
                C.forEach((c,i)=>{ const key=Math.round(x(c.jac)/12);
                  (bucket[key]=bucket[key]||[]).push({c,i}); });
                const placed=[];
                Object.values(bucket).forEach(list=>{
                  list.forEach((e,k)=>{
                    const spread=(k-(list.length-1)/2)*13;
                    placed.push({...e, dy:spread}); });
                });
                return placed.map(({c,i,dy})=>{
                  const latent=c.shared&&c.jac<0.05;
                  return (
                  <g key={i}>
                    <circle cx={x(c.jac)} cy={rowY(c.shared)+dy} r={latent?6.5:4}
                            fill={c.cell==="crowded"?"var(--crowd)":latent?"var(--hl)":"var(--indep)"}
                            stroke={latent?"var(--ink)":"none"} strokeWidth="1.2"
                            opacity={c.shared?.95:.45}/>
                    {c.shared && <text className="axis" x={x(c.jac)+9} y={rowY(c.shared)+dy+3}>
                      {c.a} · {c.b}</text>}
                  </g>);});
              })()}
              <text className="axis" x={W/2} y={H-6} textAnchor="middle">
                share of long book held in common
              </text>
            </svg>);})()}
          <p className="note">
            Top-left — same bet, books that do not overlap — is the quadrant
            every chart above this panel is blind to. Top-right is ordinary
            crowding, and the bottom row is two managers who happen to hold some
            of the same names without agreeing on anything.
          </p>

          <table style={{marginTop:16}}>
            <thead><tr><th>Pair</th><th>Same bet</th><th>Book overlap</th>
              <th>Reading</th></tr></thead>
            <tbody>{tRes.cells.filter(c=>c.shared).slice(0,14).map((c,i)=>(
              <tr key={i}>
                <td className="v">{c.a} · {c.b}</td>
                <td className="v">yes</td>
                <td className="v">{c.jac===null?"no positions loaded":(c.jac*100).toFixed(1)+"%"}</td>
                <td className={c.cell==="crowded"?"neg":""}>
                  {c.cell==="crowded"?"same bet, same names — someone cuts"
                   :c.cell==="latent"?"same bet, different names — watch"
                   :"same bet, positions unknown"}</td>
              </tr>))}
              {!tRes.cells.filter(c=>c.shared).length && (
                <tr><td colSpan="4" className="axis">No shared bets found.</td></tr>)}
            </tbody>
          </table>

          <p className="note">
            The reading column is about exits, not about who is wrong.{" "}
            <strong>Same bet, same names</strong> means that when the thesis
            breaks both managers reach for the same door in the same hour, and the
            second one out is marked at what the first did to the price — the loss
            is the crowding, not the analysis.{" "}
            <strong>Same bet, different names</strong> means the correlation is
            already there and no position report will show it; the books stay
            clean while the P&amp;L converges. Two managers land here on the
            model's reading of their prose, which is a judgement and not a
            measurement — the returns table above is where that reading can be
            checked against what the books actually did.
          </p>

          {tRes.months.length>0 && (
            <React.Fragment>
              <h2 style={{fontSize:"15px",marginTop:20}}>Catalysts by month</h2>
              {(()=>{
                const M=tRes.months, mx=Math.max(...M.map(m=>m.pods));
                return (
                <svg viewBox={`0 0 700 ${16+M.length*24}`}
                     style={{width:"100%",height:"auto",marginTop:8}}
                     role="img" aria-label="managers waiting per month">
                  {M.map((m,i)=>(
                    <g key={m.m} transform={`translate(0 ${i*24})`}>
                      <text className="axis" x="0" y="16">{m.m}</text>
                      <rect x="90" y="5" width={Math.max(3,m.pods/mx*430)} height="14" rx="2"
                            fill={m.pods>=3?"var(--crowd)":"#b9bec5"}
                            opacity={m.pods>=3?.9:.7}/>
                      <text className="axis" x={98+Math.max(3,m.pods/mx*430)} y="16">
                        {m.pods} manager{m.pods>1?"s":""}
                      </text>
                    </g>))}
                </svg>);})()}
              <p className="note">
                Several managers waiting on one month is concentration in time.
                No exposure report shows it, because it is not an exposure — the
                books can be perfectly diversified and still resolve together.
              </p>
              <p className="note">
                <strong>A manager who wrote no dates is not in this chart.</strong>{" "}
                Every bar is built from catalysts the documents actually stated,
                and the extraction returns null rather than guessing a date from
                vague language. An empty month is therefore a fact about the
                writing before it is a fact about the risk, and the tallest bar
                partly measures who writes specifically. Read it as a prompt to
                ask the quiet ones what their date is, not as a complete calendar.
              </p>
              <p className="note">
                <strong>Relative timing resolves against an as-of date, and it
                has to.</strong> A memo saying "December" carries its year on
                the letterhead rather than in the sentence, so anything reading
                it later must be told which December. Without that anchor two
                runs over identical theses produced different calendars — one
                placed catalysts in a January falling before the books existed —
                while the pairs and the grouping stayed stable across those same
                runs. Only the calendar moved, which is why it went unnoticed.
                Dates now resolve forward from the last date in the returns
                data, and genuinely vague timing returns null rather than a
                guess.
              </p>
              <p className="note">
                Catalysts here resolve forward from{" "}
                <strong>{tRes.asOf}</strong>
                {tRes.asOfFromData
                  ? ", the last date in the returns data."
                  : ", a fixed default, because no returns data is loaded to "
                    +"take a date from. It is deliberately fixed rather than "
                    +"today's date: an earlier version used the system clock, "
                    +"so identical documents produced a calendar that moved "
                    +"forward every day the page sat unopened. Upload a book "
                    +"whose names resolve against a returns bundle and the "
                    +"anchor comes from the data instead."}
              </p>
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------- the text layer ---------- */
function Thesis({data}){
  const t=data.thesis;
  if(!t) return null;
  const cells=["crowded","latent","coincidental","independent"];
  const cnt=Object.fromEntries(cells.map(c=>[c,t.pairs.filter(p=>p.cell===c).length]));
  const mean=(rows,f)=>{const v=rows.map(r=>r[f]).filter(x=>x!=null);
    return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const lat=t.pairs.filter(p=>p.cell==="latent");
  const cro=t.pairs.filter(p=>p.cell==="crowded");
  const [sel,setSel]=useState("latent");
  const shown=t.pairs.filter(p=>p.cell===sel)
    .sort((a,b)=>b.thesis-a.thesis).slice(0,12);
  const maxW=Math.max(1,...t.weeks.map(w=>w.pods));
  const col=ty=>ty==="crowded"?"var(--crowd)":ty==="factor"?"var(--factor)":
    ty==="independent"?"var(--indep)":"#b9bec5";
  return (
    <div className="panel">
      <h2>What the books cannot show: reading what each manager wrote</h2>
      <p className="note" style={{marginTop:2}}>
        Positions are the last thing to converge. A discretionary pod writes a
        mandate and a thesis before it trades, so managers can reach one
        conclusion months before their books look alike. Every tool above
        starts from holdings and is structurally blind to that. Here each pod's
        written thesis is read by a language model, reduced to a structured
        claim, and the claims are then grouped by whether the same event in the
        world would make two managers right or wrong together.
      </p>

      <div className="grid3" style={{marginTop:16}}>
        <div className="stat" style={{borderLeftColor:"var(--crowd)"}}>
          <div className="lbl">same bet, same names</div>
          <div className="big">{cnt.crowded}</div>
          <div className="axis">pairs — someone has to cut</div>
        </div>
        <div className="stat" style={{borderLeftColor:"var(--hl)"}}>
          <div className="lbl">same bet, no shared names</div>
          <div className="big">{cnt.latent}</div>
          <div className="axis">pairs — invisible to every chart above</div>
        </div>
        <div className="stat" style={{borderLeftColor:"var(--indep)"}}>
          <div className="lbl">shared names, different bets</div>
          <div className="big">{cnt.coincidental}</div>
          <div className="axis">pairs — overlap without a common cause</div>
        </div>
      </div>

      <div className="bar" style={{marginTop:16}}>
        <span className="axis">show</span>
        {cells.map(c=>(
          <button key={c} className="btn" aria-pressed={sel===c}
                  onClick={()=>setSel(c)}>{c} ({cnt[c]})</button>
        ))}
      </div>
      <table>
        <thead><tr><th>Pair</th><th>Thesis overlap</th><th>Book overlap</th>
          <th>Return corr</th><th>Residual corr</th></tr></thead>
        <tbody>{shown.map((p,i)=>(
          <tr key={i}>
            <td className="v">{p.a} · {p.b}{" "}
              <span className={"tag t-"+(p.true||"mixed")}
                    style={{marginLeft:6}}>{p.true}</span></td>
            <td className="v">{(p.thesis*100).toFixed(0)}%</td>
            <td className="v">{(p.book*100).toFixed(1)}%</td>
            <td className="v">{p.raw==null?"—":(p.raw>=0?"+":"")+p.raw.toFixed(3)}</td>
            <td className="v">{p.resid==null?"—":(p.resid>=0?"+":"")+p.resid.toFixed(3)}</td>
          </tr>))}
        </tbody>
      </table>

      {lat.length>0 && (
        <p className="note">
          The <strong>{lat.length} latent pairs</strong> share a bet and hold
          nothing in common, so no amount of position analysis reaches them.
          Their mean return correlation is{" "}
          <strong>{mean(lat,"raw")==null?"—":(mean(lat,"raw")>=0?"+":"")+mean(lat,"raw").toFixed(3)}</strong>{" "}
          and their mean residual correlation is{" "}
          <strong>{mean(lat,"resid")==null?"—":(mean(lat,"resid")>=0?"+":"")+mean(lat,"resid").toFixed(3)}</strong>.
          Read that carefully rather than as a win: high return correlation with
          a shared thesis and no shared book is what a common <em>factor</em>
          {" "}looks like. The text found the exposure early, which is useful and
          is not the same as finding crowding. A high residual would have been
          the stronger claim, and it is not there.
        </p>
      )}
      <p className="note">
        Compare with the {cro.length} pairs that share both a bet and a book —
        mean residual{" "}
        <strong>{mean(cro,"resid")==null?"—":(mean(cro,"resid")>=0?"+":"")+mean(cro,"resid").toFixed(3)}</strong>.
        That is crowding: co-movement that survives stripping out the factors,
        and it is the cell where someone is asked to reduce.
      </p>

      <hr/>
      <h2 style={{fontSize:"15px"}}>What the fund is betting on</h2>
      <table>
        <thead><tr><th>Shared cause</th><th>Pods</th><th>Who</th></tr></thead>
        <tbody>{t.groups.filter(g=>g.members.length>1).map((g,i)=>(
          <tr key={i}>
            <td>{g.plain}</td>
            <td className="v">{g.members.length}</td>
            <td>{g.members.map((m,j)=>(
              <span key={m} className={"tag t-"+(g.types[j]||"mixed")}
                    style={{marginRight:4}}>{m}</span>))}</td>
          </tr>))}
          <tr>
            <td colSpan="3" className="axis" style={{paddingTop:8}}>
              {t.groups.filter(g=>g.members.length===1).length} further pods are
              each on a cause of their own.
            </td>
          </tr>
        </tbody>
      </table>

      {t.weeks.length>0 && (
        <React.Fragment>
          <hr/>
          <h2 style={{fontSize:"15px"}}>Concentration in time</h2>
          <p className="note" style={{marginTop:2}}>
            Catalysts the managers named, and the week each falls in. Several
            pods waiting on one date is concentration that no exposure report
            shows, because it is not an exposure — the books can be perfectly
            diversified and still resolve together.
          </p>
          <svg viewBox={`0 0 700 ${34+t.weeks.length*20}`}
               style={{width:"100%",height:"auto",marginTop:10}}
               role="img" aria-label="pods waiting per week">
            {t.weeks.map((w,i)=>(
              <g key={w.week} transform={`translate(0 ${i*20})`}>
                <text className="axis" x="0" y="14">{w.week.slice(0,10)}</text>
                <rect x="150" y="4" width={Math.max(2,w.pods/maxW*420)} height="12"
                      fill="var(--crowd)" opacity={w.pods>=3?.85:.35} rx="2"/>
                <rect x="150" y="4" width={Math.max(1,w.decisive/maxW*420)} height="12"
                      fill="var(--ink)" opacity=".25" rx="2"/>
                <text className="axis" x={158+Math.max(2,w.pods/maxW*420)} y="14">
                  {w.pods} pods · {w.decisive} decisive
                </text>
              </g>))}
          </svg>
        </React.Fragment>
      )}

      <p className="note">
        Theses are written by {t.generated_by} from each pod's real holdings and
        an assigned driver, because real manager memos are confidential. The
        macro they cite is invented. Extraction runs {t.n_runs}× per document
        and the grouping is scored on whether pairs are placed together-or-apart
        identically across runs — not on whether the groups get the same names,
        since a second run may name a group differently and still be right.
        An earlier version asked each document, in isolation, to invent a label
        that would coincidentally match another document's label; it agreed with
        itself on 8 pods of 20, and the five pods on one datacenter bet produced
        five different labels. Comparison works where coincidental naming cannot.
      </p>
    </div>
  );
}

/* ---------- 4. the unwind ---------- */
function Unwind({data}){
  const u=data.unwind;
  const ctrl=["crowded","factor","independent"]
    .map(t=>u.control.find(c=>c.type===t)).filter(Boolean);
  const cr=ctrl.find(c=>c.type==="crowded"), ind=ctrl.find(c=>c.type==="independent");
  const mult=cr&&ind&&ind.mean_damage!==0
    ? Math.abs(cr.mean_damage/ind.mean_damage) : null;
  const worst=Math.min(...ctrl.map(c=>c.mean_damage));
  const ae=(u.across_eras||[]).filter(r=>r.multiple!=null);
  const ms=ae.map(r=>r.multiple).sort((a,b)=>a-b);
  const lo=ms[0], hi=ms[ms.length-1];
  const med=ms.length%2?ms[(ms.length-1)/2]:(ms[ms.length/2-1]+ms[ms.length/2])/2;
  return (
    <div className="panel">
      <h2>What it costs when one of them is forced out</h2>
      <p className="note" style={{marginTop:2}}>
        In the most crowded era ({u.era}), each pod in turn is liquidated and
        the others are marked at the moved price. Impact is square-root in size
        over a liquidity proxy, since CRSP carries no volume — so the dollar
        figures are a scenario, not an estimate. What survives the assumption
        is which group absorbs the loss.
      </p>
      <div className="grid3" style={{marginTop:16}}>
        {ctrl.map(c=>(
          <div className="stat" key={c.type}
               style={{borderLeftColor:c.type==="crowded"?"var(--crowd)":
                       c.type==="factor"?"var(--factor)":"var(--indep)"}}>
            <div className="lbl">{c.type} pod liquidated</div>
            <div className={"big "+(c.mean_damage<0?"neg":"pos")}>{usd(c.mean_damage)}</div>
            <div className="axis">mean cost to the other {data.meta.n_pods-1} pods</div>
          </div>
        ))}
      </div>
      <svg viewBox="0 0 700 132" style={{width:"100%",height:"auto",marginTop:14}}
           role="img" aria-label="damage by type of pod liquidated">
        {ctrl.map((c,i)=>{
          // Linear bars put -0.29m and -0.47m at visually identical lengths
          // next to -6.98m, so the smaller of the two read as the larger. A
          // square-root scale keeps the dominant bar dominant while leaving
          // the small ones distinguishable. The axis note says so, because a
          // bar chart whose scale is not stated is a chart that can mislead.
          const w=Math.sqrt(Math.abs(c.mean_damage)/Math.abs(worst))*470;
          const gain=c.mean_damage>0;
          return (
          <g key={c.type} transform={`translate(0 ${i*38})`}>
            <text className="axis" x="0" y="20">{c.type}</text>
            <rect x="96" y="8" width={Math.max(3,w)} height="16"
                  fill={gain?"var(--pos)":(c.type==="crowded"?"var(--crowd)":"#b9bec5")}
                  opacity={c.type==="crowded"?.95:.75} rx="2"/>
            <text className="axis" x={104+Math.max(3,w)} y="20">
              {usd(c.mean_damage)}{gain?"  (a gain)":""}
            </text>
          </g>);})}
        <text className="axis" x="0" y="126">
          bar length is square-root scaled, so the two small bars stay
          distinguishable beside the large one
        </text>
      </svg>
      {mult && (
        <p className="note">
          In this era, liquidating a crowded pod costs the rest of the fund{" "}
          <strong>{mult.toFixed(1)}×</strong> what liquidating an independent one
          costs. Averaged over every pod of each type, so no single unlucky draw
          decides it. Liquidating a factor pod is{" "}
          {ctrl.find(c=>c.type==="factor")?.mean_damage>0?"profitable":"cheaper"}{" "}
          for everyone else — the pods short those names collect what the seller
          gives up.
        </p>
      )}
      {ae.length>1 && (
        <React.Fragment>
          <table>
            <thead><tr><th>Era</th><th>Crowded pod out</th>
              <th>Independent pod out</th><th>Multiple</th></tr></thead>
            <tbody>{ae.map(r=>(
              <tr key={r.era}>
                <td className="v">{r.era}</td>
                <td className="v neg">{usd(r.crowded)}</td>
                <td className={"v "+(r.independent<0?"neg":"pos")}>{usd(r.independent)}</td>
                <td className="v"><strong>{r.multiple==null?"—":r.multiple.toFixed(1)+"×"}</strong></td>
              </tr>))}
            </tbody>
          </table>
          <p className="note">
            <strong>The multiple is not a stable quantity.</strong> Across the
            five most crowded eras it runs from {lo.toFixed(1)}× to {hi.toFixed(1)}×,
            median {med.toFixed(1)}×. Any single era's figure looks precise and
            will not reproduce in the next one, so the honest claim is the
            ordering rather than the number: whichever era you pick, the crowded
            pods are the expensive ones to lose. A version of this page quoting
            one era's multiple as the headline would have been quoting noise to
            two significant figures.
          </p>
        </React.Fragment>
      )}
      <table>
        <thead><tr><th>Impact coefficient</th><th>Seller</th>
          <th>Everyone else</th><th>Worst single pod</th><th>Pods hurt</th></tr></thead>
        <tbody>{u.coefficient_sweep.map(s=>(
          <tr key={s.coef}>
            <td className="v">{s.coef.toFixed(1)}</td>
            <td className="v neg">{usd(s.victim_pnl)}</td>
            <td className={"v "+(s.others_total<0?"neg":"pos")}>{usd(s.others_total)}</td>
            <td className="v neg">{usd(s.worst_other)}</td>
            <td className="v">{s.n_hurt}</td>
          </tr>))}
        </tbody>
      </table>
      <p className="note">
        The dollar column moves by a factor of {(u.coefficient_sweep[u.coefficient_sweep.length-1].coef/u.coefficient_sweep[0].coef).toFixed(0)}{" "}
        down this table, because it is proportional to an assumption no daily
        return file can pin down. That is stated rather than hidden: the number
        to carry away is the multiple above, which the coefficient divides out
        of.
      </p>
      <p className="note">
        The pod liquidated in the sweep, <strong>{u.victim}</strong>, was chosen
        by long-book overlap alone — holdings only, no labels. It turned out to
        be {u.victim_true_type==="crowded"
          ? "one of the planted crowded pods."
          : "of type "+u.victim_true_type+"."}
      </p>
    </div>
  );
}

/* ---------- 5. net against gross ---------- */
function NetGross({data}){
  const w=data.worst_era;
  const hidden=w.names.filter(n=>n.gross>0&&Math.abs(n.net)/n.gross<0.5
    &&n.n_long>=data.meta.min_pods).length;
  return (
    <div className="panel">
      <h2>Net exposure against one-way pressure</h2>
      <p className="note" style={{marginTop:2}}>
        The most crowded names in {w.era}. Net is what the fund loses if the
        price moves — the right measure of market risk. Long pressure is the
        weight that would be sold into one bid if every holder left, which is
        the right measure of liquidation risk. They are different numbers and
        they answer different questions.
      </p>
      <table>
        <thead><tr><th>Permno</th><th>Pods long</th><th>Long pressure</th>
          <th>Net</th><th>Gross</th><th>Net / gross</th></tr></thead>
        <tbody>{w.names.map(n=>{
          const r=n.gross>0?n.net/n.gross:0;
          return (<tr key={n.permno}>
            <td className="v">{n.permno}</td>
            <td className="v">{n.n_long}</td>
            <td className="v">{n.long_press.toFixed(3)}</td>
            <td className="v">{n.net.toFixed(3)}</td>
            <td className="v">{n.gross.toFixed(3)}</td>
            <td className="v" style={{color:r<0.5?"var(--crowd)":"inherit"}}>
              {Math.round(r*100)}%</td>
          </tr>);})}
        </tbody>
      </table>
      <p className="note">
        {hidden>0
          ? <>{hidden} of these {w.names.length} names carry a net position under
             half their gross. A net-exposure report shows them as modest
             holdings while several managers are each long them and would each
             sell into the same bid.</>
          : <>Net and gross mostly agree here, so a net-exposure report would not
             have missed these names. Worth stating plainly rather than claiming
             otherwise — the two measures only diverge when pods take opposite
             sides, and in a universe this wide they rarely do. The argument for
             reporting both stands on principle; this simulation does not
             demonstrate it strongly.</>}
      </p>
    </div>
  );
}

function App(){
  const [d,setD]=useState(null);
  const [err,setErr]=useState(null);
  useEffect(()=>{
    fetch("data/orchestrator.json")
      .then(r=>{ if(!r.ok) throw new Error("data/orchestrator.json not found — run pods5_export_web.py"); return r.json(); })
      .then(setD).catch(e=>setErr(e.message));
  },[]);
  if(err) return <div className="wrap"><p className="note">{err}</p></div>;
  if(!d) return <div className="wrap"><p className="note">loading…</p></div>;
  const m=d.meta;
  return (
    <div className="wrap">
      <div className="kicker">multi-manager risk · crsp 1993–2024 · simulated pods, real returns</div>
      <h1>Risk Orchestrator</h1>
      <p className="lede" style={{fontWeight:600,marginBottom:10}}>
        The correlation matrix points at the wrong five pods.
      </p>
      <p className="lede">
        Twenty long/short books built from real CRSP returns. Five were
        constructed to crowd into a shared basket; five hold no name in common
        with each other but load on the same factor. Ranked by return
        correlation, the second group looks like the problem and the first is
        invisible.
      </p>
      <hr/>
      <PodTable pods={d.pods}/>
      <Separation data={d}/>
      <VaR data={d}/>
      <Ladder data={d}/>
      <Grid data={d}/>
      <Unwind data={d}/>
      <NetGross data={d}/>
      <Thesis data={d}/>
      <Upload/>
      <p className="foot">
        {m.n_pods} pods over {m.n_days.toLocaleString()} trading days ({m.start} to {m.end}),
        {" "}{m.n_eras} quarterly rebalances, {m.n_pairs} pairs.
        Factors built from {m.n_stocks_factor} stocks: {m.factor_names.join(", ")}.
        Residual nulls use a circular block bootstrap at {m.n_boot} draws;
        holdings nulls use {m.n_perm} permutations. Both are pooled across pairs,
        because a per-pair p-value floored at 1/(draws+1) cannot clear
        Benjamini-Hochberg's threshold of α/{m.n_pairs}.
        Every number here was computed by the pipeline before the page loaded;
        the browser only draws.
      </p>
      <p className="foot">
        The returns are real and the allocations are invented. Nothing here is a
        backtest and no pod is a strategy — the pods exist to generate a
        realistic joint structure across books, which is what a risk tool has to
        work on. Reading a Sharpe ratio out of this page would be reading it
        wrong.
      </p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
